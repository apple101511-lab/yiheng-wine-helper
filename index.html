        const Admin = ({ liquors, setLiquors, setView, onSaveToCloud, cloudStatus, onLogout, siteSettings, onSaveSiteSettings, logoUrl }) => {
            const [editingId, setEditingId] = React.useState(null);
            const [editForm, setEditForm] = React.useState(null);
            const [isAdding, setIsAdding] = React.useState(false);
            
            const [alertMsg, setAlertMsg] = React.useState("");
            const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);
            const [adminSearch, setAdminSearch] = React.useState('');
            const [qualityFilter, setQualityFilter] = React.useState('all'); // all | incomplete | issues | draft
            const [adminMode, setAdminMode] = React.useState('manage'); // manage | stock | batch
            const [selectedIds, setSelectedIds] = React.useState([]);
            const [batchTagCategory, setBatchTagCategory] = React.useState('purpose');
            const [batchTagValue, setBatchTagValue] = React.useState(PRESET_PURPOSES[0]);
            const [syncSeriesOnSave, setSyncSeriesOnSave] = React.useState(false);
            const [imageUploadState, setImageUploadState] = React.useState({ status: 'idle', progress: 0, message: '' });
            const imageFileInputRef = React.useRef(null);
            const [logoUploadState, setLogoUploadState] = React.useState({ status: 'idle', progress: 0, message: '' });
            const logoFileInputRef = React.useRef(null);

            React.useEffect(() => {
                const presets = BATCH_TAG_PRESETS[batchTagCategory] || [];
                if (!presets.includes(batchTagValue)) setBatchTagValue(presets[0] || '');
            }, [batchTagCategory]);

            // 拖曳排序狀態
            const [draggedIndex, setDraggedIndex] = React.useState(null);
            const [dragOverIndex, setDragOverIndex] = React.useState(null);

            const handleSiteLogoUpload = async (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = "";
                if (!file) return;

                const uploader = window.__cloudStorage?.uploadSiteLogo;
                if (!uploader) {
                    setLogoUploadState({ status: 'error', progress: 0, message: 'Logo 上傳功能尚未就緒。' });
                    return;
                }

                setLogoUploadState({ status: 'uploading', progress: 0, message: '正在處理並上傳 Logo…' });
                const result = await uploader(
                    file,
                    siteSettings?.logoUrl || "",
                    (progress) => setLogoUploadState({
                        status: 'uploading',
                        progress,
                        message: `正在上傳 Logo… ${progress}%`
                    })
                );

                if (!result?.success) {
                    setLogoUploadState({ status: 'error', progress: 0, message: result?.error || 'Logo 上傳失敗。' });
                    return;
                }

                const nextSettings = {
                    ...(siteSettings || {}),
                    logoUrl: result.url,
                    logoStoragePath: result.storagePath,
                    logoUpdatedAt: new Date().toISOString()
                };

                const saved = await onSaveSiteSettings?.(nextSettings);
                setLogoUploadState(saved
                    ? { status: 'success', progress: 100, message: 'Logo 已更新，所有使用者重新整理後會看到新版 Logo。' }
                    : { status: 'error', progress: 100, message: 'Logo 已上傳，但站台設定寫入 Firestore 失敗，請再試一次。' }
                );
            };

            const handleResetSiteLogo = async () => {
                const previousUrl = siteSettings?.logoUrl || "";
                const nextSettings = {
                    ...(siteSettings || {}),
                    logoUrl: "",
                    logoStoragePath: "",
                    logoUpdatedAt: new Date().toISOString()
                };

                const saved = await onSaveSiteSettings?.(nextSettings);
                if (!saved) {
                    setLogoUploadState({ status: 'error', progress: 0, message: '恢復預設 Logo 失敗，請確認雲端連線。' });
                    return;
                }

                if (previousUrl && window.__cloudStorage?.deleteSiteLogoFile) {
                    await window.__cloudStorage.deleteSiteLogoFile(previousUrl);
                }
                setLogoUploadState({ status: 'success', progress: 0, message: '已恢復內建預設 Logo。' });
            };

            const saveAndSync = async (updatedList, message) => {
                setLiquors(updatedList.map(normalizeLiquor));
                setAlertMsg("正在同步至雲端...");

                if (onSaveToCloud) {
                    const success = await onSaveToCloud(updatedList);
                    setAlertMsg(success ? message : "雲端儲存失敗，請確認登入狀態與網路連線。");
                } else {
                    setAlertMsg("雲端儲存功能尚未就緒。");
                }

                setTimeout(() => setAlertMsg(""), 3500);
            };

            const handleManualSync = async () => {
                setAlertMsg("正在把目前酒款同步到 Firestore...");
                const success = onSaveToCloud ? await onSaveToCloud(liquors) : false;
                setAlertMsg(success ? "目前酒款已同步到 Firestore！" : "同步失敗，請確認管理員登入與 Firestore 規則。");
                setTimeout(() => setAlertMsg(""), 3500);
            };

            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", index);
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (dragOverIndex !== index) {
                    setDragOverIndex(index);
                }
            };

            const handleDrop = (e, targetIndex) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === targetIndex) {
                    setDraggedIndex(null);
                    setDragOverIndex(null);
                    return;
                }
                const updatedLiquors = [...liquors];
                const [movedItem] = updatedLiquors.splice(draggedIndex, 1);
                updatedLiquors.splice(targetIndex, 0, movedItem);
                
                setDraggedIndex(null);
                setDragOverIndex(null);
                saveAndSync(updatedLiquors, "排序已自動同步儲存至雲端！");
            };

            const handleDragEnd = () => {
                setDraggedIndex(null);
                setDragOverIndex(null);
            };

            const handleMove = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= liquors.length) return;
                const updatedLiquors = [...liquors];
                const [movedItem] = updatedLiquors.splice(index, 1);
                updatedLiquors.splice(targetIndex, 0, movedItem);
                saveAndSync(updatedLiquors, "順序已自動同步儲存至雲端！");
            };

            const handleEdit = (liquor) => {
                setEditingId(liquor.id);
                const cloned = JSON.parse(JSON.stringify(liquor));
                if (!cloned.tags) cloned.tags = {};
                ["target", "purpose", "experience", "style", "flavor", "taste", "attributes"].forEach(key => {
                    if (!Array.isArray(cloned.tags[key])) cloned.tags[key] = [];
                });
                if (!cloned.text) cloned.text = {};
                cloned.type = inferLiquorType(cloned);
                cloned.stockStatus = getStockStatus(cloned);
                cloned.publicationStatus = getPublicationStatus(cloned);
                setEditForm(cloned);
                setSyncSeriesOnSave(false);
                setImageUploadState({ status: 'idle', progress: 0, message: '' });
                setIsAdding(false);
            };

            const handleAdd = () => {
                const newId = generateNextLiquorId(liquors);
                setEditingId(newId);
                setEditForm({
                    id: newId,
                    name: "",
                    price: 450,
                    abv: 58,
                    volume: 600,
                    age: "無",
                    image: `https://placehold.co/300x400/F9F6F0/1A2F4C?text=New\nItem`,
                    stock: true,
                    stockStatus: "現貨",
                    publicationStatus: "草稿",
                    type: "一般高粱",
                    series: "",
                    tags: { 
                        target: ["長輩", "家人", "自己"], 
                        purpose: ["送禮", "自飲"], 
                        experience: ["常喝"], 
                        style: ["經典"], 
                        flavor: ["穀糧"], 
                        taste: ["甘冽", "滑順"],
                        attributes: [],
                        collectible: false, 
                        special: false, 
                        sizeCategory: "中瓶 (500~750ml)" 
                    },
                    text: { 
                        shortIntro: "", 
                        fullIntro: "", 
                        tastingNotes: "", 
                        story: "", 
                        reason: "" 
                    }
                });
                setSyncSeriesOnSave(false);
                setImageUploadState({ status: 'idle', progress: 0, message: '' });
                setIsAdding(true);
            };

            const handleImageFileSelected = async (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = '';
                if (!file || !editForm) return;

                const uploader = window.__cloudStorage?.uploadWineImage;
                if (typeof uploader !== 'function') {
                    setImageUploadState({ status: 'error', progress: 0, message: '圖片上傳功能尚未就緒，請重新整理頁面後再試。' });
                    return;
                }

                setImageUploadState({ status: 'uploading', progress: 0, message: '正在壓縮並上傳圖片…' });
                const result = await uploader(
                    file,
                    editForm.id,
                    editForm.image || '',
                    (progress) => setImageUploadState({ status: 'uploading', progress, message: `正在上傳… ${progress}%` })
                );

                if (!result?.success) {
                    setImageUploadState({ status: 'error', progress: 0, message: result?.error || '圖片上傳失敗。' });
                    return;
                }

                setEditForm(current => current ? { ...current, image: result.url } : current);
                const originalKB = Math.max(1, Math.round((result.originalBytes || 0) / 1024));
                const optimizedKB = Math.max(1, Math.round((result.optimizedBytes || 0) / 1024));
                setImageUploadState({
                    status: 'success',
                    progress: 100,
                    message: `圖片已上傳並套用（${result.width}×${result.height}px，約 ${originalKB}KB → ${optimizedKB}KB）。請再按「儲存商品」寫入酒款資料。`
                });
            };

            const handleSave = () => {
                if (!editForm.name.trim()) {
                    setAlertMsg('請填寫商品名稱');
                    setTimeout(() => setAlertMsg(""), 3000);
                    return;
                }
                if (editForm.price < 0) {
                    setAlertMsg('價格不可為負數');
                    setTimeout(() => setAlertMsg(""), 3000);
                    return;
                }
                if (isAdding && liquors.some(l => l.id === editForm.id)) {
                    setAlertMsg(`ID ${editForm.id} 已存在，請取消後重新新增。`);
                    setTimeout(() => setAlertMsg(""), 3500);
                    return;
                }

                let finalSizeCat = "中瓶 (500~750ml)";
                if (editForm.volume < 500) finalSizeCat = "小瓶 (<500ml)";
                else if (editForm.volume > 750) finalSizeCat = "大瓶/罈裝 (>750ml)";
                
                const finalForm = {
                    ...editForm,
                    type: editForm.type || inferLiquorType(editForm),
                    publicationStatus: editForm.publicationStatus === "草稿" ? "草稿" : "已發布",
                    stockStatus: editForm.stockStatus || getStockStatus(editForm),
                    stock: (editForm.stockStatus || getStockStatus(editForm)) !== "暫無",
                    tags: {
                        ...editForm.tags,
                        sizeCategory: finalSizeCat
                    }
                };

                let updatedList = isAdding 
                    ? [...liquors, finalForm] 
                    : liquors.map(l => l.id === finalForm.id ? finalForm : l);

                const seriesName = String(finalForm.series || '').trim();
                if (syncSeriesOnSave && seriesName) {
                    updatedList = updatedList.map(item => {
                        if (item.id === finalForm.id) return finalForm;
                        if (String(item.series || '').trim() !== seriesName) return item;
                        return copySeriesSharedFields(item, finalForm);
                    });
                }

                setEditingId(null);
                setEditForm(null);
                setSyncSeriesOnSave(false);
                saveAndSync(updatedList, syncSeriesOnSave && seriesName ? `商品已儲存，並同步「${seriesName}」系列共用資料！` : "商品資料已成功儲存至雲端！");
            };

            const handleChange = (field, value, isNested = false, nestedCategory = null) => {
                if (isNested) {
                    setEditForm({
                        ...editForm,
                        [nestedCategory]: {
                            ...editForm[nestedCategory],
                            [field]: value
                        }
                    });
                } else {
                    setEditForm({ ...editForm, [field]: value });
                }
            };

            const handleAddTag = (category, tag) => {
                const currentList = editForm.tags[category] || [];
                if (!currentList.includes(tag)) {
                    setEditForm({
                        ...editForm,
                        tags: {
                            ...editForm.tags,
                            [category]: [...currentList, tag]
                        }
                    });
                }
            };

            const handleRemoveTag = (category, tag) => {
                const currentList = editForm.tags[category] || [];
                setEditForm({
                    ...editForm,
                    tags: {
                        ...editForm.tags,
                        [category]: currentList.filter(t => t !== tag)
                    }
                });
            };

            const handleDuplicate = (liquor) => {
                const base = normalizeLiquor(JSON.parse(JSON.stringify(liquor)));
                const usedIds = new Set(liquors.map(item => item.id));
                let seq = liquors.length + 1;
                let newId = `L${String(seq).padStart(3, '0')}`;
                while (usedIds.has(newId)) { seq += 1; newId = `L${String(seq).padStart(3, '0')}`; }
                const copy = { ...base, id: newId, name: `${base.name}（複製）`, publicationStatus: "草稿" };
                setEditingId(newId);
                setEditForm(copy);
                setSyncSeriesOnSave(false);
                setIsAdding(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleQuickStock = (liquor, status) => {
                const updated = liquors.map(item => item.id === liquor.id ? { ...item, stockStatus: status, stock: status !== '暫無' } : item);
                saveAndSync(updated, `「${liquor.name}」庫存狀態已更新！`);
            };

            const handleQuickPublication = (liquor, status) => {
                const updated = liquors.map(item => item.id === liquor.id ? { ...item, publicationStatus: status } : item);
                saveAndSync(updated, `「${liquor.name}」已切換為${status}！`);
            };

            const handlePullSeriesShared = () => {
                const seriesName = String(editForm?.series || '').trim();
                if (!seriesName) {
                    setAlertMsg('請先填寫「系列 / 產品家族」。');
                    setTimeout(() => setAlertMsg(''), 3000);
                    return;
                }
                const peer = liquors.find(item => item.id !== editForm.id && String(item.series || '').trim() === seriesName);
                if (!peer) {
                    setAlertMsg(`目前找不到其他「${seriesName}」系列酒款可帶入。`);
                    setTimeout(() => setAlertMsg(''), 3200);
                    return;
                }
                setEditForm(current => copySeriesSharedFields(current, normalizeLiquor(peer)));
                setAlertMsg(`已從「${peer.name}」帶入系列共用介紹、故事、品飲筆記、風味與口感；尚未儲存。`);
                setTimeout(() => setAlertMsg(''), 4200);
            };

            const toggleSelected = (id) => setSelectedIds(current => current.includes(id) ? current.filter(x => x !== id) : [...current, id]);

            const handleBatchStock = (status) => {
                if (!selectedIds.length) return;
                const updated = liquors.map(item => selectedIds.includes(item.id) ? { ...item, stockStatus: status, stock: status !== '暫無' } : item);
                saveAndSync(updated, `已批次更新 ${selectedIds.length} 款酒的庫存狀態。`);
            };

            const handleBatchPublication = (status) => {
                if (!selectedIds.length) return;
                const updated = liquors.map(item => selectedIds.includes(item.id) ? { ...item, publicationStatus: status } : item);
                saveAndSync(updated, `已批次將 ${selectedIds.length} 款酒設為${status}。`);
            };

            const handleBatchTag = (action) => {
                if (!selectedIds.length || !batchTagValue) return;
                const updated = liquors.map(item => {
                    if (!selectedIds.includes(item.id)) return item;
                    const normalized = normalizeLiquor(item);
                    const current = normalized.tags?.[batchTagCategory] || [];
                    const next = action === 'add' ? Array.from(new Set([...current, batchTagValue])) : current.filter(tag => tag !== batchTagValue);
                    return { ...normalized, tags: { ...normalized.tags, [batchTagCategory]: next } };
                });
                saveAndSync(updated, `已批次${action === 'add' ? '加入' : '移除'}「${batchTagValue}」標籤。`);
            };

            const handleExportJson = () => {
                const blob = new Blob([JSON.stringify(liquors.map(normalizeLiquor), null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `yiheng-wines-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
            };

            const handleImportJson = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('格式不正確');
                        const normalized = parsed.map(normalizeLiquor);
                        const duplicateIds = [...new Set(normalized.map(x => x.id).filter((id, idx, arr) => id && arr.indexOf(id) !== idx))];
                        const invalidRows = normalized.filter(x => !x.id || !String(x.name || '').trim() || !(Number(x.abv) > 0) || !(Number(x.volume) > 0));
                        if (duplicateIds.length) {
                            setAlertMsg(`匯入已停止：發現重複 ID ${duplicateIds.slice(0, 5).join('、')}${duplicateIds.length > 5 ? '…' : ''}`);
                            event.target.value = '';
                            setTimeout(() => setAlertMsg(''), 6500);
                            return;
                        }
                        if (invalidRows.length) {
                            setAlertMsg(`匯入已停止：${invalidRows.length} 筆資料缺少 ID、酒名、酒精度或容量。`);
                            event.target.value = '';
                            setTimeout(() => setAlertMsg(''), 6500);
                            return;
                        }
                        const success = await onSaveToCloud(normalized);
                        if (success) {
                            setLiquors(normalized);
                            const needsTags = normalized.filter(x => getLiquorQuality(x, normalized).missingTags.length > 0).length;
                            setAlertMsg(`已匯入 ${normalized.length} 款酒並同步雲端${needsTags ? `；其中 ${needsTags} 款仍有推薦標籤待補` : '！'}`);
                        } else setAlertMsg('匯入後雲端同步失敗，請確認登入狀態。');
                    } catch (e) {
                        setAlertMsg('JSON 匯入失敗，請確認檔案是由本後台匯出的酒款資料。');
                    }
                    event.target.value = '';
                    setTimeout(() => setAlertMsg(''), 4000);
                };
                reader.readAsText(file, 'utf-8');
            };

            const adminAuditRows = React.useMemo(() => liquors.map((liquor, index) => ({
                liquor,
                index,
                quality: getLiquorQuality(liquor, liquors)
            })), [liquors]);

            const auditSummary = React.useMemo(() => ({
                total: adminAuditRows.length,
                complete: adminAuditRows.filter(row => row.quality.errors.length === 0 && row.quality.missingTags.length === 0).length,
                incomplete: adminAuditRows.filter(row => row.quality.missingTags.length > 0).length,
                issues: adminAuditRows.filter(row => row.quality.errors.length > 0 || row.quality.warnings.length > 0).length,
                published: adminAuditRows.filter(row => isLiquorPublished(row.liquor)).length,
                drafts: adminAuditRows.filter(row => !isLiquorPublished(row.liquor)).length
            }), [adminAuditRows]);

            const visibleAdminRows = React.useMemo(() => {
                const q = adminSearch.trim().toLowerCase();
                return adminAuditRows.filter(row => {
                    const { liquor, quality } = row;
                    if (qualityFilter === 'incomplete' && quality.missingTags.length === 0) return false;

                    if (!q) return true;
                    const text = [liquor.id, liquor.name, liquor.series, liquor.type, liquor.volume, liquor.abv].filter(Boolean).join(' ').toLowerCase();
                    return text.includes(q);
                });
            }, [adminAuditRows, adminSearch, qualityFilter]);

                    </div>

                    <div className="space-y-6">

                                        onChange={e => handleChange('name', e.target.value)} 
                                        placeholder="如：58度白金龍"
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-km-red mb-1">牌價 / 售價 (NT$) *</label>
                                    <input 
                                        type="number" 
                                        value={editForm.price} 
                                        onChange={e => handleChange('price', parseInt(e.target.value) || 0)} 
                                        className="w-full border-2 border-km-gold/60 rounded-lg p-2.5 focus:border-km-blue outline-none font-bold text-gray-800" 
                                    />
                                    <p className="text-[11px] text-gray-400 mt-1">※ 前台統一顯示「詢問專人」，此價格供測驗預算篩選與內部管理使用</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">酒精濃度 (% Vol)</label>
                                    <input 
                                        type="number" 
                                        step="0.1"
                                        value={editForm.abv} 
                                        onChange={e => handleChange('abv', parseFloat(e.target.value) || 0)} 
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">容量 (ml)</label>
                                    <input 
                                        type="number" 
                                        value={editForm.volume} 
                                        onChange={e => handleChange('volume', parseInt(e.target.value) || 0)} 
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">年份標註</label>
                                    <input 
                                        type="text" 
                                        value={editForm.age} 
                                        onChange={e => handleChange('age', e.target.value)} 
                                        placeholder="如：無、5年、陳高"
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">酒款類型</label>
                                    <select value={editForm.type || inferLiquorType(editForm)} onChange={e => handleChange('type', e.target.value)} className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none bg-white">
                                        {PRESET_TYPES.map(type => <option key={type} value={type}>{type}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">庫存狀態</label>
                                    <select value={editForm.stockStatus || getStockStatus(editForm)} onChange={e => handleChange('stockStatus', e.target.value)} className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none bg-white">
                                        {PRESET_STOCK_STATUSES.map(status => <option key={status} value={status}>{status}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">前台發布狀態</label>
                                    <select value={editForm.publicationStatus || getPublicationStatus(editForm)} onChange={e => handleChange('publicationStatus', e.target.value)} className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none bg-white">
                                        {PRESET_PUBLICATION_STATUSES.map(status => <option key={status} value={status}>{status}</option>)}
                                    </select>
                                    <p className="text-[11px] text-gray-400 mt-1">草稿不會出現在前台搜尋、推薦與分享連結中。</p>
                                </div>
                                <div className="md:col-span-3">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">系列 / 產品家族（選填）</label>
                                    <input
                                        type="text"
                                        value={editForm.series || ''}
                                        onChange={e => handleChange('series', e.target.value)}
                                        placeholder="例如：白金龍、戰酒黑金龍、創世者、瓏時"
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none"
                                    />
                                    <p className="text-[11px] text-gray-400 mt-1">同一支酒不同容量可共用系列名稱，但仍保留各自獨立 ID、價格與庫存。</p>
                                    {String(editForm.series || '').trim() && (
                                        <div className="mt-3 flex flex-col md:flex-row md:items-center gap-3 bg-white border rounded-lg p-3">
                                            <button type="button" onClick={handlePullSeriesShared} className="px-3 py-2 rounded-lg border border-km-gold text-km-blue text-xs font-bold">從同系列帶入共用資料</button>
                                            <label className="flex items-start gap-2 text-xs text-gray-600 cursor-pointer">
                                                <input type="checkbox" checked={syncSeriesOnSave} onChange={e => setSyncSeriesOnSave(e.target.checked)} className="mt-0.5" />
                                                <span>儲存時同步共用資料到同系列（類型、介紹、故事、品飲筆記、推薦理由、風味、口感）；容量、價格、庫存、圖片與情境標籤不會被覆蓋。</span>
                                            </label>
                                        </div>
                                    )}
                                </div>
                                <div className="md:col-span-3">
                                    <label className="block text-sm font-medium text-gray-700 mb-2">商品圖片</label>
                                    <div className="grid grid-cols-1 md:grid-cols-[160px_1fr] gap-4 bg-white border rounded-xl p-4">
                                        <div className="aspect-square rounded-xl overflow-hidden bg-gray-100 border flex items-center justify-center">
                                            {editForm.image ? (
                                                <img src={editForm.image} alt={editForm.name || '酒款圖片預覽'} className="w-full h-full object-contain" />
                                            ) : (
                                                <div className="text-xs text-gray-400 text-center px-3">尚未設定圖片</div>
                                            )}
                                        </div>
                                        <div className="space-y-3">
                                            <input
                                                ref={imageFileInputRef}
                                                type="file"
                                                accept="image/jpeg,image/png,image/webp"
                                                onChange={handleImageFileSelected}
                                                className="hidden"
                                            />
                                            <div className="flex flex-wrap items-center gap-2">
                                                <button
                                                    type="button"
                                                    onClick={() => imageFileInputRef.current?.click()}
                                                    disabled={imageUploadState.status === 'uploading'}
                                                    className={`px-4 py-2.5 rounded-lg text-sm font-bold transition ${imageUploadState.status === 'uploading' ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-km-blue text-white hover:bg-opacity-90'}`}
                                                >
                                                    {imageUploadState.status === 'uploading' ? '圖片上傳中…' : '⬆ 選擇圖片並上傳'}
                                                </button>
                                                <span className="text-xs text-gray-500">支援 JPG / PNG / WebP，單檔 12MB 以下</span>
                                            </div>

                                            {imageUploadState.status === 'uploading' && (
                                                <div>
                                                    <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                                                        <div className="h-full bg-km-gold transition-all" style={{ width: `${Math.max(2, imageUploadState.progress || 0)}%` }}></div>
                                                    </div>
                                                    <p className="text-xs text-gray-500 mt-1">{imageUploadState.message}</p>
                                                </div>
                                            )}
                                            {imageUploadState.status === 'success' && <p className="text-xs text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg p-2.5">✓ {imageUploadState.message}</p>}
                                            {imageUploadState.status === 'error' && <p className="text-xs text-red-700 bg-red-50 border border-red-200 rounded-lg p-2.5">⚠ {imageUploadState.message}</p>}

                                            <p className="text-[11px] text-gray-500 leading-relaxed">
                                                上傳時會在瀏覽器端自動縮到長邊最多 1600px 並轉成 WebP，再存到 Firebase Storage 的 <code className="bg-gray-100 px-1 rounded">wines/{editForm.id}/</code>。上傳成功後會自動取得圖片網址；不同容量仍會各自使用自己的酒款 ID 與圖片。
                                            </p>

                                            <details className="border-t pt-2">
                                                <summary className="text-xs font-bold text-gray-600 cursor-pointer">進階：改用圖片網址</summary>
                                                <input
                                                    type="text"
                                                    value={editForm.image || ''}
                                                    onChange={e => handleChange('image', e.target.value)}
                                                    placeholder="https://..."
                                                    className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none text-sm text-gray-600 mt-2"
                                                />
                                                <p className="text-[11px] text-gray-400 mt-1">保留網址輸入是為了相容舊資料；新圖片建議直接用上方按鈕上傳。</p>
                                            </details>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 2. 客觀產品屬性 */}
                        <div className="bg-amber-50/60 p-4 rounded-xl border border-amber-200">

                                <h4 className="text-sm font-bold text-km-blue uppercase tracking-wider">2. 客觀產品屬性</h4>
                                <p className="text-xs text-gray-500 mt-1">只有能從產品資料確認的事實才勾選；不要把「看起來特別」當成限量或限定。</p>
                            </div>
                            <TagEditor
                                label="產品屬性"
                                tags={editForm.tags.attributes || []}
                                onAddTag={(tag) => handleAddTag('attributes', tag)}
                                onRemoveTag={(tag) => handleRemoveTag('attributes', tag)}
                                presets={PRESET_ATTRIBUTES}
                                badgeColor="gold"
                            />
                        </div>

                        {/* 3. 風味與口感標籤 */}
                        <div className="bg-[#FFFDF9] p-4 rounded-xl border border-km-gold/40">
                            <h4 className="text-sm font-bold text-km-blue uppercase tracking-wider mb-3">3. 風味與口感設定</h4>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <TagEditor 
                                    label="風味香氣標籤 (👃 風味)"
                                    tags={editForm.tags.flavor || []}
                                    onAddTag={(tag) => handleAddTag('flavor', tag)}
                                    onRemoveTag={(tag) => handleRemoveTag('flavor', tag)}
                                    presets={PRESET_FLAVORS}
                                    badgeColor="red"
                                />
                                <TagEditor 
                                    label="口感層次標籤 (👅 口感)"
                                    tags={editForm.tags.taste || []}
                                    onAddTag={(tag) => handleAddTag('taste', tag)}

                        {/* 4. 推薦條件標籤 */}
                        <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-200">

                                <p className="text-xs text-gray-500 mt-1">這些標籤用來判斷「什麼需求下適合推薦這支酒」，不是替酒款打分。</p>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <TagEditor
                                    label="推薦對象"
                                    tags={editForm.tags.target || []}
                                    onAddTag={(tag) => handleAddTag('target', tag)}
                                    onRemoveTag={(tag) => handleRemoveTag('target', tag)}
                                    presets={PRESET_TARGETS}
                                    badgeColor="blue"
                                />
                                <TagEditor
                                    label="推薦用途"
                                    tags={editForm.tags.purpose || []}
                                    onAddTag={(tag) => handleAddTag('purpose', tag)}
                                    onRemoveTag={(tag) => handleRemoveTag('purpose', tag)}
                                    presets={PRESET_PURPOSES}
                                    badgeColor="blue"
                                />

                                    label="飲酒經驗"
                                    tags={editForm.tags.experience || []}

                                                                disabled={index === 0}
                                                                className="text-gray-400 hover:text-km-blue disabled:opacity-20 text-[10px] leading-tight px-1 py-0.5 rounded hover:bg-gray-100"
                                                                title="上移"
                                                            >
                                                                ▲
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={(e) => { e.stopPropagation(); handleMove(index, 1); }}
                                                                disabled={index === liquors.length - 1}
                                                                className="text-gray-400 hover:text-km-blue disabled:opacity-20 text-[10px] leading-tight px-1 py-0.5 rounded hover:bg-gray-100"
                                                                title="下移"
                                                            >
                                                                ▼
                                                            </button>
                                                        </div>
                                                    </div>
                                                </td>
                                                <td className="p-3">
                                                    <img src={liquor.image} alt={liquor.name} className="w-12 h-12 object-cover rounded-lg shadow-sm" />
                                                </td>
                                                <td className="p-3">
                                                    <div className="font-bold text-km-blue text-sm">{liquor.name}</div>
                                                    <div className="text-xs text-gray-400">{liquor.volume}ml · {liquor.abv}% Vol{liquor.series ? ` · ${liquor.series}` : ''}</div>
                                                </td>
                                                <td className="p-3 min-w-[120px]">
                                                    {quality.errors.length > 0 ? (
                                                        <span title={quality.errors.join('；')} className="text-[11px] bg-red-50 text-red-700 border border-red-200 px-2 py-1 rounded-full">⚠ 有錯誤</span>
                                                    ) : quality.missingTags.length > 0 ? (
                                                        <span title={`待補：${quality.missingTags.map(k => TAG_LABELS[k]).join('、')}`} className="text-[11px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-1 rounded-full">待補 {quality.missingTags.length} 類</span>
                                                    ) : quality.warnings.length > 0 ? (
                                                        <span title={quality.warnings.join('；')} className="text-[11px] bg-sky-50 text-sky-700 border border-sky-200 px-2 py-1 rounded-full">建議檢查</span>
                                                    ) : (
                                                        <span className="text-[11px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-2 py-1 rounded-full">✓ 完整</span>
                                                    )}
                                                </td>
                                                <td className="p-3"><span className="text-[11px] bg-gray-100 text-gray-700 px-2 py-1 rounded-full">{inferLiquorType(liquor)}</span></td>
                                                <td className="p-3 text-sm font-mono font-bold text-gray-800">NT$ {liquor.price}</td>
                                                <td className="p-3">
                                                    <div className="flex flex-wrap gap-1 max-w-[160px]">
                                                        {liquor.tags.flavor && liquor.tags.flavor.map(f => (
                                                            <span key={f} className="text-[10px] bg-red-50 text-km-red px-1.5 py-0.5 rounded border border-red-200">{f}</span>
                                                        ))}
                                                    </div>
                                                </td>
                                                <td className="p-3">
                                                    <div className="flex flex-wrap gap-1 max-w-[160px]">
                                                        {liquor.tags.taste && liquor.tags.taste.map(t => (
                                                            <span key={t} className="text-[10px] bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded border border-blue-200">{t}</span>
                                                        ))}
                                                    </div>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <select value={getStockStatus(liquor)} onChange={(e) => handleQuickStock(liquor, e.target.value)} className="text-xs border rounded-lg px-2 py-1 bg-white">
                                                        {PRESET_STOCK_STATUSES.map(status => <option key={status} value={status}>{status}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-3 text-center">
                                                    <select value={getPublicationStatus(liquor)} onChange={(e) => handleQuickPublication(liquor, e.target.value)} className={`text-xs border rounded-lg px-2 py-1 bg-white ${getPublicationStatus(liquor) === '草稿' ? 'text-violet-700 border-violet-200' : 'text-emerald-700 border-emerald-200'}`}>
                                                        {PRESET_PUBLICATION_STATUSES.map(status => <option key={status} value={status}>{status}</option>)}
                                                    </select>
                                                </td>
                                                <td className="p-3 text-right whitespace-nowrap">
                                                    <button
                                                        onClick={() => handleEdit(liquor)}
                                                        className={`mr-3 text-sm font-bold ${isEditingThisRow ? 'text-km-blue underline underline-offset-4' : 'text-blue-600 hover:text-blue-800'}`}
                                                    >
                                                        {isEditingThisRow ? '編輯中' : '編輯'}
                                                    </button>
                                                    <button onClick={() => handleDuplicate(liquor)} className="text-km-gold hover:text-km-blue mr-3 text-sm font-bold">複製</button>
                                                    <button onClick={() => setConfirmDeleteId(liquor.id)} className="text-red-500 hover:text-red-700 text-sm font-medium">刪除</button>
                                                </td>
                                            </tr>
                                            {isEditingThisRow && (
                                                <tr className="bg-blue-50/30 border-b-2 border-km-blue/20">
                                                    <td colSpan="11" className="p-3 md:p-4">
                                                        <div className="relative">
                                                            <div className="mb-2 flex items-center gap-2 text-xs text-km-blue font-bold">
                                                                <span className="inline-flex w-2 h-2 rounded-full bg-km-blue"></span>
                                                                正在原地編輯：{liquor.name}
                                                            </div>
                                                            {renderForm()}
                                                        </div>
                                                    </td>
                                                </tr>
                                            )}
                                            </React.Fragment>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        };

        const AgeVerification = ({ onConfirm, logoUrl }) => (
            <div className="fixed inset-0 bg-km-blue flex flex-col items-center justify-center px-4 z-[200]">
                <div className="bg-km-white p-8 md:p-10 rounded-2xl shadow-2xl border-4 border-km-gold-light max-w-sm w-full text-center">
                    <img 
                        src={logoUrl || DEFAULT_LOGO_URL} 
                        alt="怡亨 Logo" 
                        className="h-24 w-auto mx-auto mb-6 drop-shadow-md"
                        onError={(e) => {
                            e.target.style.display = 'none';
                        }}
                    />
                    <h2 className="text-2xl font-serif font-bold text-km-blue mb-4">您是否已滿18歲？</h2>
                    <p className="text-gray-600 mb-8 text-sm leading-relaxed font-medium">
                        本網站含酒類商品資訊，請確認您已達法定飲酒年齡。
                    </p>
                    <div className="flex flex-col space-y-4 w-full">
                        <Button variant="primary" onClick={onConfirm} className="w-full py-3.5 text-lg shadow-lg">
                            是，我已滿18歲
                        </Button>
                        <a href="https://youtu.be/3hoWEm_qsnI?si=gKnNjDzYXeIRqgcy" target="_top" className="block w-full">
                            <div className="w-full py-3.5 px-6 rounded-lg font-bold text-center transition-all duration-200 ease-in-out border border-km-gray text-gray-600 hover:bg-gray-50 text-lg bg-white cursor-pointer active:scale-[0.98]">
                                否，我未滿18歲
                            </div>
                        </a>
                    </div>
                    <p className="mt-8 text-xs text-km-red font-bold opacity-80">禁止酒駕 🥃 未滿十八歲禁止飲酒</p>
                </div>
            </div>
        );

        const App = () => {
            const [isAgeVerified, setIsAgeVerified] = React.useState(false);
            const [view, setView] = React.useState('home'); 
            const [siteSettings, setSiteSettings] = React.useState(() => {
                try {
                    const saved = localStorage.getItem(SITE_SETTINGS_KEY);
                    const parsed = saved ? JSON.parse(saved) : {};
                    return parsed && typeof parsed === 'object' ? parsed : {};
                } catch (e) {
                    return {};
                }
            });
            const logoUrl = siteSettings?.logoUrl || DEFAULT_LOGO_URL;
            const [liquors, setLiquors] = React.useState(() => {
                try {
                    const localSaved = localStorage.getItem('yiheng_liquors_catalog_v1') || localStorage.getItem('yihan_liquors_catalog_v1');
                    if (localSaved) {
                        const parsed = JSON.parse(localSaved);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed.map(normalizeLiquor);
                    }
                } catch(e) {}
                return initialLiquors.map(normalizeLiquor);
            });
            const publicLiquors = React.useMemo(() => liquors.map(normalizeLiquor).filter(isLiquorPublished), [liquors]);
            const [quizResults, setQuizResults] = React.useState(null);
            const [selectedLiquor, setSelectedLiquor] = React.useState(null);
            const [activeFlavor, setActiveFlavor] = React.useState(null);
            const [cloudStatus, setCloudStatus] = React.useState('connecting'); // 'connecting' | 'synced' | 'saving' | 'empty' | 'offline'
            const [inquiryIds, setInquiryIds] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('yiheng_inquiry_list_v1');
                    const parsed = saved ? JSON.parse(saved) : [];
                    return Array.isArray(parsed) ? parsed : [];
                } catch (e) {
                    return [];
                }
            });
            const [showInquiryList, setShowInquiryList] = React.useState(false);
            const [inquiryPrefs, setInquiryPrefs] = React.useState(() => {
                try { return JSON.parse(localStorage.getItem('yiheng_inquiry_prefs_v1') || '{}'); } catch (e) { return {}; }
            });
            const [compareIds, setCompareIds] = React.useState(() => {
                try { const data = JSON.parse(localStorage.getItem('yiheng_compare_v1') || '[]'); return Array.isArray(data) ? data : []; } catch (e) { return []; }
            });
            const [showCompare, setShowCompare] = React.useState(false);
            const [favoriteIds, setFavoriteIds] = React.useState(() => {
                try { const data = JSON.parse(localStorage.getItem('yiheng_favorites_v1') || '[]'); return Array.isArray(data) ? data : []; } catch (e) { return []; }
            });
            const [recentIds, setRecentIds] = React.useState(() => {
                try { const data = JSON.parse(localStorage.getItem('yiheng_recent_v1') || '[]'); return Array.isArray(data) ? data : []; } catch (e) { return []; }
            });
            const deepLinkHandled = React.useRef(false);

            const [showLogin, setShowLogin] = React.useState(false);
            const [isAdminAuth, setIsAdminAuth] = React.useState(false);

            // 同步 Firebase Authentication 狀態（重新整理後仍可辨識管理員登入）
            React.useEffect(() => {
                const syncAuthState = () => {
                    const isAdmin = !!(window.__cloudStorage && window.__cloudStorage.isAdmin && window.__cloudStorage.isAdmin());
                    setIsAdminAuth(isAdmin);
                    if (!isAdmin && view === 'admin') {
                        setView('home');
                    }
                };

                const handleAuthChanged = (event) => {
                    const isAdmin = !!event.detail?.isAdmin;
                    setIsAdminAuth(isAdmin);
                    if (!isAdmin && view === 'admin') {
                        setView('home');
                    }
                };

                syncAuthState();
                window.addEventListener('firebase-auth-changed', handleAuthChanged);
                window.addEventListener('cloud-ready', syncAuthState);

                return () => {
                    window.removeEventListener('firebase-auth-changed', handleAuthChanged);
                    window.removeEventListener('cloud-ready', syncAuthState);
                };
            }, [view]);

            // 監聽站台設定（目前包含品牌 Logo）
            React.useEffect(() => {
                let unsubscribe = null;

                const setupSiteSettingsSubscription = () => {
                    if (window.__cloudStorage?.subscribeSiteSettings) {
                        unsubscribe = window.__cloudStorage.subscribeSiteSettings(
                            (settings) => {
                                const safeSettings = settings && typeof settings === 'object' ? settings : {};
                                setSiteSettings(safeSettings);
                                try { localStorage.setItem(SITE_SETTINGS_KEY, JSON.stringify(safeSettings)); } catch (e) {}
                            },
                            (error) => console.error("站台設定監聽失敗：", error)
                        );
                    }
                };

                if (window.__cloudStorage?.isReady) {
                    setupSiteSettingsSubscription();
                } else {
                    const handleReady = () => setupSiteSettingsSubscription();
                    window.addEventListener('cloud-ready', handleReady);
                    return () => {
                        window.removeEventListener('cloud-ready', handleReady);
                        if (unsubscribe) unsubscribe();
                    };
                }

                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            // Logo 更新時同步 favicon / Apple touch icon。
            React.useEffect(() => {
                document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((link) => {
                    link.href = logoUrl;
                });
            }, [logoUrl]);

            // 監聽並同步雲端與本地酒品資料
            React.useEffect(() => {
                let unsubscribe = null;

                const setupSubscription = () => {
                    if (window.__cloudStorage && window.__cloudStorage.isReady) {
                        unsubscribe = window.__cloudStorage.subscribeLiquors(
                            (savedItems) => {
                                if (savedItems && savedItems.length > 0) {
                                    setLiquors(savedItems.map(normalizeLiquor));
                                    setCloudStatus('synced');
                                } else if (savedItems === null) {
                                    // Firestore 尚無資料：先使用內建/本機快取資料，等管理員登入後手動首次同步。
                                    setCloudStatus('empty');
                                }
                            },
                            (error) => {
                                console.error("雲端監聽失敗:", error);
                                setCloudStatus('offline');
                            }
                        );
                    }
                };

                if (window.__cloudStorage && window.__cloudStorage.isReady) {
                    setupSubscription();
                } else {
                    const handleReady = () => setupSubscription();
                    window.addEventListener('cloud-ready', handleReady);
                    return () => {
                        window.removeEventListener('cloud-ready', handleReady);
                        if (unsubscribe) unsubscribe();
                    };
                }

                return () => {
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            React.useEffect(() => {
                window.scrollTo(0, 0);
            }, [view]);

            const handleSaveSiteSettings = async (nextSettings) => {
                const safeSettings = nextSettings && typeof nextSettings === 'object' ? nextSettings : {};
                setSiteSettings(safeSettings);
                try { localStorage.setItem(SITE_SETTINGS_KEY, JSON.stringify(safeSettings)); } catch (e) {}

                if (window.__cloudStorage?.saveSiteSettings) {
                    const success = await window.__cloudStorage.saveSiteSettings(safeSettings);
                    return !!success;
                }
                return false;
            };

            const handleSaveToCloud = async (newLiquors) => {
                const normalizedLiquors = newLiquors.map(normalizeLiquor);
                try {
                    localStorage.setItem('yiheng_liquors_catalog_v1', JSON.stringify(normalizedLiquors));
                } catch(e) {}

                if (window.__cloudStorage && window.__cloudStorage.isReady) {
                    setCloudStatus('saving');
                    const success = await window.__cloudStorage.saveLiquors(normalizedLiquors);
                    setCloudStatus(success ? 'synced' : 'offline');
                    return success;
                }

                setCloudStatus('offline');
                return false;
            };

            React.useEffect(() => {
                try {
                    localStorage.setItem('yiheng_inquiry_list_v1', JSON.stringify(inquiryIds));
                } catch (e) {}
            }, [inquiryIds]);

            React.useEffect(() => { try { localStorage.setItem('yiheng_inquiry_prefs_v1', JSON.stringify(inquiryPrefs)); } catch (e) {} }, [inquiryPrefs]);
            React.useEffect(() => { try { localStorage.setItem('yiheng_compare_v1', JSON.stringify(compareIds)); } catch (e) {} }, [compareIds]);
            React.useEffect(() => { try { localStorage.setItem('yiheng_favorites_v1', JSON.stringify(favoriteIds)); } catch (e) {} }, [favoriteIds]);
            React.useEffect(() => { try { localStorage.setItem('yiheng_recent_v1', JSON.stringify(recentIds)); } catch (e) {} }, [recentIds]);

            React.useEffect(() => {
                if (!isAgeVerified || deepLinkHandled.current) return;
                const params = new URLSearchParams(window.location.search);
                const listParam = params.get('list');
                if (listParam) {
                    const ids = listParam.split(',').map(id => decodeURIComponent(id.trim())).filter(Boolean);
                    if (ids.length) setInquiryIds(current => Array.from(new Set([...current, ...ids])));
                }
                const wineId = params.get('wine');
                if (wineId) {
                    const found = publicLiquors.find(item => item.id === wineId);
                    if (!found) return;
                    setSelectedLiquor(found);
                    setView('detail');
                }
                deepLinkHandled.current = true;
            }, [isAgeVerified, publicLiquors]);

            React.useEffect(() => {
                if (!selectedLiquor?.id || view !== 'detail') return;
                setRecentIds(current => [selectedLiquor.id, ...current.filter(id => id !== selectedLiquor.id)].slice(0, 10));
            }, [selectedLiquor?.id, view]);

            const toggleCompare = (liquorId) => {
                setCompareIds(current => {
                    if (current.includes(liquorId)) return current.filter(id => id !== liquorId);
                    if (current.length >= 3) {
                        window.alert('一次最多比較 3 款酒。');
                        return current;
                    }
                    return [...current, liquorId];
                });
            };

            const toggleFavorite = (liquorId) => {
                setFavoriteIds(current => current.includes(liquorId) ? current.filter(id => id !== liquorId) : [...current, liquorId]);
            };

            const toggleInquiry = (liquorId) => {
                setInquiryIds((current) => current.includes(liquorId)
                    ? current.filter(id => id !== liquorId)
                    : [...current, liquorId]
                );
            };

            const inquiryItems = React.useMemo(() => {
                return inquiryIds
                    .map(id => publicLiquors.find(liquor => liquor.id === id))
                    .filter(Boolean);
            }, [inquiryIds, publicLiquors]);

            const compareItems = React.useMemo(() => compareIds.map(id => publicLiquors.find(liquor => liquor.id === id)).filter(Boolean), [compareIds, publicLiquors]);

            const removeInquiry = (liquorId) => {
                setInquiryIds(current => current.filter(id => id !== liquorId));
            };

            const clearInquiry = () => {
                setInquiryIds([]);
            };

            if (!isAgeVerified) {
                return <AgeVerification onConfirm={() => setIsAgeVerified(true)} logoUrl={logoUrl} />;
            }

            const handleAdminClick = () => {
                const actuallyAdmin = !!(window.__cloudStorage && window.__cloudStorage.isAdmin && window.__cloudStorage.isAdmin());
                if (isAdminAuth || actuallyAdmin) {
                    setIsAdminAuth(true);
                    setView('admin');
                } else {
                    setShowLogin(true);
                }
            };

            const handleAdminLogout = async () => {
                if (window.__cloudStorage && window.__cloudStorage.signOutAdmin) {
                    await window.__cloudStorage.signOutAdmin();
                }
                setIsAdminAuth(false);
                setView('home');
            };

            return (
                <div className="min-h-screen flex flex-col relative">
                    <Header setView={setView} onAdminClick={handleAdminClick} cloudStatus={cloudStatus} logoUrl={logoUrl} />
                    
                    <main className="flex-grow w-full relative">
                        {view === 'home' && <Home setView={setView} logoUrl={logoUrl} />}
                        {view === 'quiz' && <Quiz setView={setView} setQuizResults={setQuizResults} liquors={publicLiquors} />}
                        {view === 'results' && <Results setView={setView} results={quizResults} setSelectedLiquor={setSelectedLiquor} onFlavorClick={setActiveFlavor} inquiryIds={inquiryIds} onToggleInquiry={toggleInquiry} compareIds={compareIds} onToggleCompare={toggleCompare} favoriteIds={favoriteIds} onToggleFavorite={toggleFavorite} />}
                        {view === 'catalog' && <Catalog setView={setView} liquors={publicLiquors} setSelectedLiquor={setSelectedLiquor} onFlavorClick={setActiveFlavor} inquiryIds={inquiryIds} onToggleInquiry={toggleInquiry} compareIds={compareIds} onToggleCompare={toggleCompare} favoriteIds={favoriteIds} onToggleFavorite={toggleFavorite} recentIds={recentIds} />}
                        {view === 'detail' && <Detail setView={setView} liquor={selectedLiquor} onFlavorClick={setActiveFlavor} inquiryIds={inquiryIds} onToggleInquiry={toggleInquiry} compareIds={compareIds} onToggleCompare={toggleCompare} favoriteIds={favoriteIds} onToggleFavorite={toggleFavorite} />}
                        {view === 'admin' && (
                            <Admin 
                                liquors={liquors} 
                                setLiquors={setLiquors} 
                                setView={setView} 
                                onSaveToCloud={handleSaveToCloud}
                                cloudStatus={cloudStatus}
                                onLogout={handleAdminLogout}
                                siteSettings={siteSettings}
                                onSaveSiteSettings={handleSaveSiteSettings}
                                logoUrl={logoUrl}
                            />
                        )}
                    </main>

                    {view !== 'admin' && view !== 'quiz' && compareItems.length > 0 && (
                        <button type="button" onClick={() => setShowCompare(true)} className="fixed left-4 bottom-5 z-[90] bg-km-blue text-white rounded-full shadow-xl px-4 py-3 font-bold text-sm flex items-center gap-2 hover:bg-opacity-95 active:scale-95 transition-all">
                            <span>⇄</span><span>比較</span><span className="bg-white text-km-blue min-w-[1.5rem] h-6 px-1 rounded-full inline-flex items-center justify-center text-xs">{compareItems.length}</span>
                        </button>
                    )}

                    {view !== 'admin' && view !== 'quiz' && inquiryItems.length > 0 && (
                        <button
                            type="button"
                            onClick={() => setShowInquiryList(true)}
                            className="fixed right-4 bottom-5 z-[90] bg-km-gold text-white rounded-full shadow-xl px-4 py-3 font-bold text-sm flex items-center gap-2 hover:bg-opacity-95 active:scale-95 transition-all"
                        >
                            <span>📝</span>
                            <span>詢問清單</span>
                            <span className="bg-white text-km-blue min-w-[1.5rem] h-6 px-1 rounded-full inline-flex items-center justify-center text-xs">{inquiryItems.length}</span>
                        </button>
                    )}

                    {view !== 'admin' && (
                        <a
                            href={OFFICIAL_LINE_URL}
                            target="_blank"
                            rel="noopener noreferrer"
                            aria-label="加入怡亨酒舖官方 LINE 詢問"
                            title="官方 LINE 詢問"
                            style={{ bottom: inquiryItems.length > 0 && view !== 'quiz' ? '5.25rem' : '1.25rem' }}
                            className="fixed right-4 z-[89] bg-[#06C755] text-white rounded-full shadow-xl px-4 py-3 font-bold text-sm flex items-center gap-2 hover:bg-[#05b04c] active:scale-95 transition-all"
                        >
                            <svg className="w-5 h-5 fill-current shrink-0" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.084.495.235l2.472 3.344V8.108c0-.345.281-.63.63-.63.348 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                            </svg>
                            <span className="whitespace-nowrap">LINE 詢問</span>
                        </a>
                    )}

                    <FlavorModal flavorKey={activeFlavor} onClose={() => setActiveFlavor(null)} />

                    {showInquiryList && (
                        <InquiryListModal items={inquiryItems} onRemove={removeInquiry} onClear={clearInquiry} onClose={() => setShowInquiryList(false)} prefs={inquiryPrefs} onPrefsChange={setInquiryPrefs} />
                    )}

                    {showCompare && (
                        <CompareModal items={compareItems} onRemove={(id) => setCompareIds(current => current.filter(itemId => itemId !== id))} onClear={() => setCompareIds([])} onClose={() => setShowCompare(false)} inquiryIds={inquiryIds} onToggleInquiry={toggleInquiry} />
                    )}

                    {showLogin && (
                        <LoginModal 
                            onClose={() => setShowLogin(false)} 
                            onSuccess={() => {
                                setShowLogin(false);
                                setIsAdminAuth(true);
                                setView('admin');
                            }} 
                        />
                    )}

                    {view !== 'admin' && view !== 'quiz' && (
                        <footer className="bg-km-blue text-km-white text-center py-7 px-5 text-sm mt-auto">
                            <p className="font-bold mb-2">怡亨酒舖｜金門在地高粱酒選酒服務</p>
                            <p className="opacity-70 text-xs leading-6 mb-2">
                                酒款、價格與庫存請以門市或官方 LINE 最新資訊為準。
                            </p>
                            <p className="opacity-70 text-xs mb-2">禁止酒駕｜未滿十八歲禁止飲酒</p>
                            <p className="opacity-45 text-xs">© 2026 怡亨選酒小幫手</p>
                        </footer>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
