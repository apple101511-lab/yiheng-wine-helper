        const MAX_IMAGE_UPLOAD_BYTES = 12 * 1024 * 1024;

        const IMAGE_WEBP_QUALITY = 0.9;
        const ACCEPTED_IMAGE_TYPES = new Set(["image/jpeg", "image/png", "image/webp"]);

        const sanitizeStorageSegment = (value) => String(value || "wine")
            .trim()
            .replace(/[^a-zA-Z0-9_-]/g, "-")
            .replace(/-+/g, "-")
            .replace(/^-|-$/g, "") || "wine";

        const loadBrowserImage = (file) => new Promise((resolve, reject) => {
            const url = URL.createObjectURL(file);
            const image = new Image();
            image.onload = () => {
                URL.revokeObjectURL(url);
                resolve(image);
            };
            image.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error("瀏覽器無法讀取這張圖片，請改用 JPG、PNG 或 WebP。"));

            image.src = url;

        const optimizeWineImage = async (file) => {
            if (!file || !ACCEPTED_IMAGE_TYPES.has(file.type)) {
                throw new Error("請選擇 JPG、PNG 或 WebP 圖片。HEIC/HEIF 請先轉成 JPG。" );
            }
            if (file.size > MAX_IMAGE_UPLOAD_BYTES) {
                throw new Error("圖片檔案太大，請選擇 12MB 以下的圖片。" );
            }

            const image = await loadBrowserImage(file);
            const originalWidth = image.naturalWidth || image.width;
            const originalHeight = image.naturalHeight || image.height;
            const scale = Math.min(1, IMAGE_MAX_DIMENSION / Math.max(originalWidth, originalHeight));
            const width = Math.max(1, Math.round(originalWidth * scale));
            const height = Math.max(1, Math.round(originalHeight * scale));

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d", { alpha: true });
            if (!ctx) throw new Error("無法處理圖片，請重新整理後再試一次。" );
            ctx.drawImage(image, 0, 0, width, height);

            const blob = await new Promise((resolve) => {
                canvas.toBlob(resolve, "image/webp", IMAGE_WEBP_QUALITY);
            });
            if (!blob) throw new Error("圖片轉檔失敗，請換一張圖片再試。" );

            return {
                blob,
                width,
                height,
                originalBytes: file.size,
                optimizedBytes: blob.size
            };
        };

        const getOwnStoragePathFromUrl = (url) => {
            try {
                if (!url) return null;
                const parsed = new URL(url);
                if (parsed.hostname !== "firebasestorage.googleapis.com") return null;
                const bucketMarker = `/v0/b/${firebaseConfig.storageBucket}/o/`;
                if (!parsed.pathname.startsWith(bucketMarker)) return null;
                const encodedPath = parsed.pathname.slice(bucketMarker.length);
                return decodeURIComponent(encodedPath);
            } catch (e) {
                return null;
            }
        };

        // 提供 React 使用的 Firebase 操作介面
        window.__cloudStorage = {
            isReady: true,
            isLocal: false,

            signInAdmin: async (email, password) => {
                try {
                    const credential = await signInWithEmailAndPassword(auth, email, password);

                    if (credential.user.uid !== ADMIN_UID) {
                        await signOut(auth);
                        return {
                            success: false,
                            error: "此帳號沒有管理員權限"
                        };
                    }

                    currentUser = credential.user;
                    return {
                        success: true,
                        user: credential.user
                    };
                } catch (error) {
                    console.error("Firebase 登入失敗：", error);
                    return {
                        success: false,
                        code: error.code || "",
                        error: error.message || "登入失敗"
                    };
                }
            },

            signOutAdmin: async () => {
                await signOut(auth);
                currentUser = null;
            },

            isAdmin: () => {
                return !!currentUser && currentUser.uid === ADMIN_UID;
            },

            uploadWineImage: async (file, wineId, previousImageUrl = "", onProgress = null) => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    return { success: false, error: "請先以管理員帳號登入後再上傳圖片。" };
                }

                try {
                    const optimized = await optimizeWineImage(file);
                    const safeWineId = sanitizeStorageSegment(wineId);
                    const storagePath = `wines/${safeWineId}/main-${Date.now()}.webp`;
                    const imageRef = storageRef(storage, storagePath);
                    const metadata = {
                        contentType: "image/webp",
                        cacheControl: "public,max-age=31536000,immutable",
                        customMetadata: {
                            wineId: String(wineId || ""),
                            uploadedBy: currentUser.uid
                        }
                    };

                    const uploadTask = uploadBytesResumable(imageRef, optimized.blob, metadata);
                    const snapshot = await new Promise((resolve, reject) => {
                        uploadTask.on(
                            "state_changed",
                            (snap) => {
                                const progress = snap.totalBytes ? Math.round((snap.bytesTransferred / snap.totalBytes) * 100) : 0;
                                if (typeof onProgress === "function") onProgress(progress);
                            },
                            reject,
                            () => resolve(uploadTask.snapshot)
                        );
                    });

                    const url = await getDownloadURL(snapshot.ref);
                    const oldPath = getOwnStoragePathFromUrl(previousImageUrl);
                    if (oldPath && oldPath !== storagePath) {
                        try {
                            await deleteObject(storageRef(storage, oldPath));
                        } catch (cleanupError) {
                            console.warn("舊圖片清理失敗，不影響新圖片使用：", cleanupError);
                        }
                    }

                    return {
                        success: true,
                        url,
                        storagePath,
                        width: optimized.width,
                        height: optimized.height,
                        originalBytes: optimized.originalBytes,
                        optimizedBytes: optimized.optimizedBytes
                    };
                } catch (error) {
                    console.error("Firebase Storage 圖片上傳失敗：", error);
                    let message = error?.message || "圖片上傳失敗";
                    if (error?.code === "storage/unauthorized") {
                        message = "Firebase Storage 拒絕上傳。請確認 Storage 已啟用，並套用管理員寫入規則。";
                    } else if (error?.code === "storage/bucket-not-found") {
                        message = "找不到 Firebase Storage bucket，請先在 Firebase Console 啟用 Storage。";
                    } else if (error?.code === "storage/quota-exceeded") {
                        message = "Firebase Storage 配額不足，請到 Firebase Console 查看用量。";
                    }
                    return { success: false, code: error?.code || "", error: message };
                }
            },

            uploadSiteLogo: async (file, previousLogoUrl = "", onProgress = null) => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    return { success: false, error: "請先以管理員帳號登入後再上傳 Logo。" };
                }

                try {
                    const optimized = await optimizeWineImage(file);
                    // 放在 wines/_branding 下，可沿用目前 wines/** 的 Storage Rules。
                    const storagePath = `wines/_branding/site-logo-${Date.now()}.webp`;
                    const logoRef = storageRef(storage, storagePath);
                    const metadata = {
                        contentType: "image/webp",
                        cacheControl: "public,max-age=31536000,immutable",
                        customMetadata: {
                            kind: "site-logo",
                            uploadedBy: currentUser.uid
                        }
                    };

                    const uploadTask = uploadBytesResumable(logoRef, optimized.blob, metadata);
                    const snapshot = await new Promise((resolve, reject) => {
                        uploadTask.on(
                            "state_changed",
                            (snap) => {
                                const progress = snap.totalBytes ? Math.round((snap.bytesTransferred / snap.totalBytes) * 100) : 0;
                                if (typeof onProgress === "function") onProgress(progress);
                            },
                            reject,
                            () => resolve(uploadTask.snapshot)
                        );
                    });

                    const url = await getDownloadURL(snapshot.ref);

                    // 新 Logo 已成功後才清理舊的 Firebase Storage Logo。
                    const oldPath = getOwnStoragePathFromUrl(previousLogoUrl);
                    if (oldPath && oldPath !== storagePath && oldPath.includes("/_branding/")) {
                        try {
                            await deleteObject(storageRef(storage, oldPath));
                        } catch (cleanupError) {
                            console.warn("舊 Logo 清理失敗，不影響新 Logo 使用：", cleanupError);
                        }
                    }

                    return {
                        success: true,
                        url,
                        storagePath,
                        width: optimized.width,
                        height: optimized.height,
                        originalBytes: optimized.originalBytes,
                        optimizedBytes: optimized.optimizedBytes
                    };
                } catch (error) {
                    console.error("Firebase Storage Logo 上傳失敗：", error);
                    let message = error?.message || "Logo 上傳失敗";
                    if (error?.code === "storage/unauthorized") {
                        message = "Firebase Storage 拒絕上傳。請確認你已登入管理員，且 Storage Rules 允許 wines/** 管理員寫入。";
                    } else if (error?.code === "storage/bucket-not-found") {
                        message = "找不到 Firebase Storage bucket，請確認 Storage 已建立。";
                    } else if (error?.code === "storage/quota-exceeded") {
                        message = "Firebase Storage 配額不足，請到 Firebase Console 查看用量。";
                    }
                    return { success: false, code: error?.code || "", error: message };
                }
            },

            deleteSiteLogoFile: async (logoUrl = "") => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    return { success: false, error: "請先以管理員帳號登入。" };
                }
                try {
                    const oldPath = getOwnStoragePathFromUrl(logoUrl);
                    if (oldPath && oldPath.includes("/_branding/")) {
                        await deleteObject(storageRef(storage, oldPath));
                    }
                    return { success: true };
                } catch (error) {
                    console.warn("Logo 檔案刪除失敗：", error);
                    return { success: false, error: error?.message || "Logo 檔案刪除失敗" };
                }
            },

            saveSiteSettings: async (settings) => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    console.error("沒有管理員寫入權限");
                    return false;
                }

                try {
                    const catalogDoc = doc(
                        db,
                        "artifacts",
                        APP_ID,
                        "public",
                        "data",
                        "inventory",
                        "catalog"
                    );

                    await setDoc(catalogDoc, {
                        siteSettings: settings || {},
                        siteSettingsUpdatedAt: new Date().toISOString()
                    }, { merge: true });

                    try {
                        localStorage.setItem("yiheng_site_settings_v1", JSON.stringify(settings || {}));
                    } catch (e) {}

                    return true;
                } catch (error) {
                    console.error("站台設定儲存失敗：", error);
                    return false;
                }
            },

            subscribeSiteSettings: (onUpdate, onError) => {
                const catalogDoc = doc(
                    db,
                    "artifacts",
                    APP_ID,
                    "public",
                    "data",
                    "inventory",
                    "catalog"
                );

                return onSnapshot(
                    catalogDoc,
                    (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            const settings = (data && data.siteSettings && typeof data.siteSettings === "object")
                                ? data.siteSettings
                                : {};
                            try {
                                localStorage.setItem("yiheng_site_settings_v1", JSON.stringify(settings));
                            } catch (e) {}
                            onUpdate(settings);
                        } else {
                            onUpdate({});
                        }
                    },
                    (error) => {
                        console.error("站台設定讀取失敗：", error);
                        if (onError) onError(error);
                    }
                );
            },

            saveLiquors: async (liquorsList) => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    console.error("沒有管理員寫入權限");
                    return false;
                }

                try {
                    const catalogDoc = doc(
                        db,
                        "artifacts",
                        APP_ID,
                        "public",
                        "data",
                        "inventory",
                        "catalog"
                    );

                    await setDoc(catalogDoc, {
                        items: liquorsList,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });

                    // localStorage 僅作為本機快取，不作為主要資料來源
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(liquorsList));
                    } catch (e) {}

                    return true;
                } catch (error) {
                    console.error("雲端儲存失敗：", error);
                    return false;
                }
            },

            subscribeLiquors: (onUpdate, onError) => {
                const catalogDoc = doc(
                    db,
                    "artifacts",
                    APP_ID,
                    "public",
                    "data",
                    "inventory",
                    "catalog"
                );

                return onSnapshot(
                    catalogDoc,
                    (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            if (data && Array.isArray(data.items)) {
                                try {
                                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.items));
                                } catch (e) {}
                                onUpdate(data.items);
                            }
                        } else {
                            // 第一次建立資料庫時尚未有 catalog 文件。
                            // 網站仍會顯示內建/快取酒款，管理員可在後台按「同步目前資料」首次上傳。
                            onUpdate(null);
                        }
                    },
                    (error) => {
                        console.error("Firestore 讀取失敗：", error);
                        if (onError) onError(error);
                    }
                );
            }
        };

        // 監聽 Firebase Authentication 狀態，讓 React 能在重新整理後維持管理員登入狀態
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            window.dispatchEvent(new CustomEvent("firebase-auth-changed", {
                detail: {
                    isAdmin: !!user && user.uid === ADMIN_UID
                }
            }));
        });

        window.dispatchEvent(new CustomEvent("cloud-ready"));
    </script>

            "穀糧": { title: "穀糧香", desc: "最典型的「高粱本體味」，像熟米飯、穀物的甜香。" },
            "麴香": { title: "麴香", desc: "比穀糧香更有發酵感，是金門高粱辨識度很高的一類。" },
            "蜜餞": { title: "梅子蜜餞", desc: "帶有青梅、烏梅、話梅等果乾氣息，常帶酸、甜、鹹交錯感。" },
            "鮮果": { title: "梨瓜果香", desc: "帶有水梨、甜瓜、青蘋果等新鮮水果香，讓酒顯得清甜、年輕、活潑。" },
            "花蜜": { title: "花蜜甜香", desc: "帶有白花、蜂蜜的氣息，屬於柔和、芳香的雅致甜感。" },
            "醬陳": { title: "醬陳香", desc: "常見於有年份或熟陳酒，帶有老酒香與窖香，風格沉穩厚實。" },
            "草本": { title: "草本藥材", desc: "老酒容易散發此氣味（如甘草、人蔘），常伴隨微苦、回甘。" },
            "木質": { title: "木質香", desc: "常見於陳年或桶陳產品，帶有橡木、檀木、杉木等乾燥木質氣息。" },
            "香草奶油": { title: "香草奶油", desc: "常見於桶陳酒款，帶有香草莢、奶油、奶油糖般的柔和甜香。" },
            "焦糖烘焙": { title: "焦糖烘焙", desc: "帶有焦糖、太妃糖、烤糖或烘烤氣息，常與木桶熟成風格一起出現。" },
            "堅果": { title: "堅果香", desc: "帶有杏仁、核桃、榛果等堅果類氣息，常讓酒體顯得更成熟。" },
            "辛香": { title: "辛香料", desc: "帶有胡椒、丁香、肉桂等辛香料般的香氣或刺激感。" },
            "煙燻泥煤": { title: "煙燻泥煤", desc: "帶有煙燻、焦木、泥煤或炭火感，多見於特殊桶陳或跨類型風格。" },
            "茶香": { title: "茶香", desc: "帶有紅茶、烏龍、乾燥茶葉等成熟、微澀而有層次的香氣。" }
        };

        // 標籤字典：後台新增標籤時以這些標準詞為主，避免同義詞越長越亂。
        const PRESET_FLAVORS = ["穀糧", "麴香", "蜜餞", "鮮果", "花蜜", "醬陳", "草本", "木質", "香草奶油", "焦糖烘焙", "堅果", "辛香", "煙燻泥煤", "茶香"];
        const PRESET_TASTES = ["甘冽", "滑順", "圓潤", "綿甜", "醇厚", "清爽", "回甘", "有勁", "酸爽"];
        const PRESET_TARGETS = ["長輩", "家人", "主管/客戶", "朋友", "伴侶", "自己"];
        const PRESET_PURPOSES = ["送禮", "自飲", "收藏", "宴客", "紀念", "嘗鮮"];
        const PRESET_EXPERIENCES = ["第一次喝", "偶爾喝", "常喝", "老饕"];
        const PRESET_STYLES = ["經典", "體面", "穩重", "霸氣", "文雅", "特別", "喜氣", "有故事"];
        const PRESET_ATTRIBUTES = ["紀念酒", "限量", "專供／限定", "金門限定", "聯名", "禮盒", "套組", "罈裝", "特殊造型"];

        const PRESET_TYPES = ["一般高粱", "陳年高粱", "桶陳", "紀念酒", "限量／特色", "禮盒", "罈裝"];
        const PRESET_STOCK_STATUSES = ["現貨", "少量", "可詢問", "暫無"];
        const PRESET_PUBLICATION_STATUSES = ["已發布", "草稿"];
        const BATCH_TAG_PRESETS = {
            target: PRESET_TARGETS,
            purpose: PRESET_PURPOSES,
            experience: PRESET_EXPERIENCES,
            style: PRESET_STYLES,
            attributes: PRESET_ATTRIBUTES,
            flavor: PRESET_FLAVORS,
            taste: PRESET_TASTES
        };
        const REQUIRED_RECOMMENDATION_TAGS = ["target", "purpose", "experience", "flavor", "taste"];
        const TAG_LABELS = { target: "推薦對象", purpose: "推薦用途", experience: "飲酒經驗", style: "形象特色", flavor: "香氣", taste: "口感", attributes: "產品屬性" };
        const DEPRECATED_STYLE_TAGS = ["造型", "金門限定", "輕巧"];
        const LEGACY_TASTE_TAGS = ["爽淨", "回甘有勁", "微酸生津", "圓潤柔和", "強勁有力", "柔順", "俐落", "滑順清爽", "滑順回甘"];

        const inferLiquorType = (liquor = {}) => {
            if (liquor.type) return liquor.type;
            const tags = liquor.tags || {};
            const text = liquor.text || {};
            const haystack = [
                liquor.name, liquor.age,
                ...(Array.isArray(tags.style) ? tags.style : []),
                ...(Array.isArray(tags.purpose) ? tags.purpose : []),
                text.shortIntro, text.fullIntro, text.story
            ].filter(Boolean).join(' ');
            if (/(桶陳|雪莉桶|波本桶|橡木桶|威士忌桶|雙桶)/.test(haystack)) return "桶陳";
            if (/(陳高|陳年|熟陳|老酒|特窖|窖藏)/.test(haystack)) return "陳年高粱";
            if (/紀念/.test(haystack)) return "紀念酒";
            if (/(罈|壇裝|甕裝)/.test(haystack)) return "罈裝";
            if (/禮盒/.test(haystack)) return "禮盒";
            if (tags.special) return "限量／特色";
            return "一般高粱";
        };

        const getStockStatus = (liquor = {}) => {
            if (PRESET_STOCK_STATUSES.includes(liquor.stockStatus)) return liquor.stockStatus;
            return liquor.stock === false ? "暫無" : "現貨";
        };

        const getPublicationStatus = (liquor = {}) => liquor.publicationStatus === "草稿" ? "草稿" : "已發布";
        const isLiquorPublished = (liquor = {}) => getPublicationStatus(liquor) === "已發布";

        // 同系列不同容量仍是不同 SKU；只同步真正適合共用的內容。
        const copySeriesSharedFields = (target = {}, source = {}) => {
            const targetTags = target.tags || {};
            const sourceTags = source.tags || {};
            return {
                ...target,
                type: source.type || inferLiquorType(source),
                tags: {
                    ...targetTags,
                    flavor: Array.isArray(sourceTags.flavor) ? [...sourceTags.flavor] : [],
                    taste: Array.isArray(sourceTags.taste) ? [...sourceTags.taste] : []
                },
                text: {
                    ...(target.text || {}),
                    shortIntro: source.text?.shortIntro || "",
                    fullIntro: source.text?.fullIntro || "",
                    tastingNotes: source.text?.tastingNotes || "",
                    story: source.text?.story || "",
                    reason: source.text?.reason || ""
                }
            };
        };

        const escapeHtml = (value = "") => String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

        const getQrImageUrl = (url) => `https://quickchart.io/qr?text=${encodeURIComponent(url)}&size=420&margin=1&dark=1A2F4C&light=FFFFFF`;

        const OFFICIAL_LINE_URL = "https://lin.ee/9O8E0wy";

        const getDerivedAttributes = (liquor = {}) => {
            const tags = liquor.tags || {};
            const attrs = Array.isArray(tags.attributes) ? [...tags.attributes] : [];
            const push = (value) => { if (value && !attrs.includes(value)) attrs.push(value); };
            const styles = Array.isArray(tags.style) ? tags.style : [];
            const type = inferLiquorType(liquor);
            if (styles.includes("金門限定")) push("金門限定");
            if (styles.includes("造型")) push("特殊造型");
            if (type === "紀念酒") push("紀念酒");
            if (type === "禮盒") push("禮盒");
            if (type === "罈裝") push("罈裝");
            return attrs;
        };

        const normalizeLiquor = (liquor = {}) => ({
            ...liquor,
            series: typeof liquor.series === 'string' ? liquor.series : '',
            publicationStatus: getPublicationStatus(liquor),
            type: inferLiquorType(liquor),
            stockStatus: getStockStatus(liquor),
            stock: getStockStatus(liquor) !== "暫無",
            tags: {
                ...(liquor.tags || {}),
                target: Array.isArray(liquor.tags?.target) ? liquor.tags.target : [],
                purpose: Array.isArray(liquor.tags?.purpose) ? liquor.tags.purpose : [],
                experience: Array.isArray(liquor.tags?.experience) ? liquor.tags.experience : [],
                style: Array.isArray(liquor.tags?.style) ? liquor.tags.style : [],
                flavor: Array.isArray(liquor.tags?.flavor) ? liquor.tags.flavor : [],
                taste: Array.isArray(liquor.tags?.taste) ? liquor.tags.taste : [],
                attributes: getDerivedAttributes(liquor)
            },
            text: { ...(liquor.text || {}) }
        });

        // 後台資料健檢：只檢查「資料是否能穩定被搜尋、推薦、分享」，不替酒款做主觀評分。
        const getLiquorQuality = (liquor = {}, allLiquors = []) => {
            const item = normalizeLiquor(liquor);
            const errors = [];
            const warnings = [];
            const missingTags = [];
            if (!String(item.id || '').trim()) errors.push('缺少 ID');
            if (item.id && allLiquors.filter(x => x.id === item.id).length > 1) errors.push('ID 重複');
            if (!String(item.name || '').trim()) errors.push('缺少酒名');
            if (!(Number(item.abv) > 0)) errors.push('酒精度未設定');
            if (!(Number(item.volume) > 0)) errors.push('容量未設定');
            if (Number(item.price) < 0 || Number.isNaN(Number(item.price))) errors.push('價格格式錯誤');
            if (!String(item.image || '').trim()) warnings.push('缺少酒款圖片');
            else if (!/^https?:\/\//i.test(item.image) && !/^data:image\//i.test(item.image)) warnings.push('圖片網址格式可疑');
            REQUIRED_RECOMMENDATION_TAGS.forEach(key => {
                if (!Array.isArray(item.tags?.[key]) || item.tags[key].length === 0) missingTags.push(key);
            });
            const deprecatedStyles = (item.tags?.style || []).filter(x => DEPRECATED_STYLE_TAGS.includes(x));
            const legacyTastes = (item.tags?.taste || []).filter(x => LEGACY_TASTE_TAGS.includes(x));
            if (deprecatedStyles.length) warnings.push(`舊版形象標籤：${deprecatedStyles.join('、')}`);
            if (legacyTastes.length) warnings.push(`口感詞建議統一：${legacyTastes.join('、')}`);
            if (missingTags.length) warnings.push(`待補：${missingTags.map(k => TAG_LABELS[k]).join('、')}`);
            return {
                errors,
                warnings,
                missingTags,
                complete: errors.length === 0 && missingTags.length === 0 && warnings.filter(w => !w.startsWith('舊版') && !w.startsWith('口感詞')).length === 0
            };
        };

        const generateNextLiquorId = (liquors = []) => {
            const used = new Set(liquors.map(x => String(x.id || '')));
            const nums = [...used].map(id => /^L(\d+)$/.exec(id)).filter(Boolean).map(m => Number(m[1]));
            let next = (nums.length ? Math.max(...nums) : 0) + 1;
            let id = `L${String(next).padStart(3, '0')}`;
            while (used.has(id)) { next += 1; id = `L${String(next).padStart(3, '0')}`; }
            return id;
        };

        const getBaseSiteUrl = () => `${window.location.origin}${window.location.pathname}`;
        const getWineShareUrl = (id) => `${getBaseSiteUrl()}?wine=${encodeURIComponent(id)}`;
        const getInquiryShareUrl = (ids) => `${getBaseSiteUrl()}?list=${ids.map(encodeURIComponent).join(',')}`;

        const copyPlainText = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                return ok;
            } catch (e) {
                return false;
            }
        };

        const canvasWrappedLines = (ctx, text, maxWidth) => {
            const chars = String(text || '').split('');
            const lines = [];
            let line = '';
            chars.forEach(char => {
                const test = line + char;
                if (ctx.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = char;
                } else {
                    line = test;
                }
            });
            if (line) lines.push(line);
            return lines;
        };

        const blobToDataUrl = (blob) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(reader.error || new Error('Blob 轉 Data URL 失敗'));
            reader.readAsDataURL(blob);
        });

        const loadImageElement = (src, timeoutMs = 12000, useCors = false) => new Promise(resolve => {
            if (!src) return resolve(null);
            const img = new Image();
            let done = false;
            const finish = (value) => {
                if (done) return;
                done = true;
                clearTimeout(timer);
                resolve(value);
            };
            const timer = setTimeout(() => finish(null), timeoutMs);

            if (useCors) {
                img.crossOrigin = 'anonymous';
                img.referrerPolicy = 'no-referrer';
            }

            img.onload = () => finish(img);
            img.onerror = () => finish(null);
            img.src = src;
        });

        const loadCanvasImage = async (src, timeoutMs = 15000) => {
            if (!src) return null;

            const isFirebaseStorage =
                typeof src === 'string' &&
                src.includes('firebasestorage.googleapis.com');

            if (isFirebaseStorage) {
                try {
                    const response = await fetch(src, {
                        method: 'GET',
                        mode: 'cors',
                        credentials: 'omit',
                        cache: 'no-store'
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const blob = await response.blob();
                    if (!blob || !String(blob.type || '').startsWith('image/')) {
                        throw new Error(`回傳格式不是圖片：${blob?.type || 'unknown'}`);
                    }

                    const dataUrl = await blobToDataUrl(blob);
                    const img = await loadImageElement(dataUrl, timeoutMs, false);
                    if (img) return img;
                } catch (error) {
                    console.warn('Firebase Storage 酒圖無法轉入分享圖片：', error);
                }
            }

            // QR Code 或其他來源的備援載入方式
            const fallback = await loadImageElement(src, timeoutMs, true);
            if (!fallback) console.warn('分享圖片無法載入圖片：', src);
            return fallback;
        };

        const drawContainedImage = (ctx, img, x, y, w, h) => {
            ctx.fillStyle = '#FFFFFF';
            ctx.strokeStyle = '#E2DFD8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.roundRect(x, y, w, h, 24);
            ctx.fill();
            ctx.stroke();
            if (!img) {
                ctx.fillStyle = '#A7A7A7';
                ctx.font = '24px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('酒款圖片', x + w / 2, y + h / 2);
                ctx.textAlign = 'left';
                return;
            }
            const scale = Math.min((w - 24) / img.width, (h - 24) / img.height);
            const dw = img.width * scale;
            const dh = img.height * scale;
            const dx = x + (w - dw) / 2;
            const dy = y + (h - dh) / 2;
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(x + 1, y + 1, w - 2, h - 2, 22);
            ctx.clip();
            ctx.drawImage(img, dx, dy, dw, dh);
            ctx.restore();
        };

        const makeShareBlob = async ({ liquor = null, results = null }) => {
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1350;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = '#F9F6F0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#1A2F4C';
            ctx.fillRect(0, 0, canvas.width, 170);

            ctx.fillStyle = '#E8D5A5';
            ctx.font = 'bold 42px sans-serif';
            ctx.fillText('怡亨選酒小幫手', 72, 92);

            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px sans-serif';
            ctx.fillText(liquor ? '酒款分享卡' : '我的選酒結果', 72, 132);

            if (liquor) {
                const normalized = normalizeLiquor(liquor);
                const helperUrl = getWineShareUrl(normalized.id);

                const [wineImg, helperQr, lineQr] = await Promise.all([
                    loadCanvasImage(normalized.image),
                    loadCanvasImage(getQrImageUrl(helperUrl)),
                    loadCanvasImage(getQrImageUrl(OFFICIAL_LINE_URL))
                ]);

                // 酒款圖片
                drawContainedImage(ctx, wineImg, 60, 215, 340, 455);

                // 酒款基本資料
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 46px sans-serif';
                const titleLines = canvasWrappedLines(ctx, normalized.name, 560).slice(0, 3);
                titleLines.forEach((line, i) => ctx.fillText(line, 445, 270 + i * 58));

                let y = 270 + titleLines.length * 58 + 18;

                ctx.fillStyle = '#A63C30';
                ctx.font = '27px sans-serif';
                ctx.fillText(`${normalized.abv}% Vol · ${normalized.volume}ml`, 445, y);

                y += 40;
                ctx.fillStyle = '#666';
                ctx.font = '22px sans-serif';
                ctx.fillText(normalized.type || '高粱酒', 445, y);

                if (normalized.series) {
                    y += 32;
                    ctx.fillText(`系列：${normalized.series}`, 445, y);
                }

                y += 54;
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('風味', 445, y);

                ctx.fillStyle = '#555';
                ctx.font = '23px sans-serif';
                const flavorLines = canvasWrappedLines(
                    ctx,
                    (normalized.tags?.flavor || []).slice(0, 5).join('・') || '依酒款資料為準',
                    440
                ).slice(0, 2);
                flavorLines.forEach((line, i) => ctx.fillText(line, 525, y + i * 32));

                y += Math.max(52, flavorLines.length * 32 + 18);
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 24px sans-serif';
                ctx.fillText('口感', 445, y);

                ctx.fillStyle = '#555';
                ctx.font = '23px sans-serif';
                const tasteLines = canvasWrappedLines(
                    ctx,
                    (normalized.tags?.taste || []).slice(0, 5).join('・') || '依酒款資料為準',
                    440
                ).slice(0, 2);
                tasteLines.forEach((line, i) => ctx.fillText(line, 525, y + i * 32));

                // 推薦重點
                const boxY = 710;
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#E2DFD8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(60, boxY, 960, 205, 24);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 27px sans-serif';
                ctx.fillText('推薦重點', 92, boxY + 50);

                ctx.fillStyle = '#555';
                ctx.font = '24px sans-serif';
                const intro = normalized.text?.reason || normalized.text?.shortIntro || '';
                const introLines = canvasWrappedLines(ctx, intro, 850).slice(0, 4);
                introLines.forEach((line, i) => ctx.fillText(line, 92, boxY + 98 + i * 34));

                // 雙 QR
                const qrTop = 950;
                const drawQrBlock = (x, title, subtitle, img) => {
                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#E2DFD8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(x, qrTop, 445, 285, 22);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#1A2F4C';
                    ctx.font = 'bold 25px sans-serif';
                    ctx.fillText(title, x + 28, qrTop + 42);

                    drawContainedImage(ctx, img, x + 118, qrTop + 58, 210, 170);

                    ctx.fillStyle = '#666';
                    ctx.font = '18px sans-serif';
                    const lines = canvasWrappedLines(ctx, subtitle, 380).slice(0, 2);
                    lines.forEach((line, i) => ctx.fillText(line, x + 30, qrTop + 252 + i * 24));
                };

                drawQrBlock(60, '選酒小幫手', '查看完整酒款介紹與加入詢問清單', helperQr);
                drawQrBlock(575, '官方 LINE', '詢問即時牌價、現貨與選酒建議', lineQr);

                if (!wineImg) {
                    ctx.fillStyle = '#A63C30';
                    ctx.font = '17px sans-serif';
                    ctx.fillText('※ 酒款圖片無法載入，請確認 Firebase Storage CORS 設定。', 72, 1265);
                }
            } else if (results) {
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('為你挑出的酒款', 72, 245);

                const items = (results.top3 || []).slice(0, 3).map(normalizeLiquor);
                const imgs = await Promise.all(items.map(item => loadCanvasImage(item.image)));

                items.forEach((item, idx) => {
                    const top = 300 + idx * 275;

                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#E2DFD8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(60, top, 960, 235, 22);
                    ctx.fill();
                    ctx.stroke();

                    drawContainedImage(ctx, imgs[idx], 82, top + 22, 170, 190);

                    ctx.fillStyle = '#C5A059';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText(String(idx + 1).padStart(2, '0'), 278, top + 50);

                    ctx.fillStyle = '#1A2F4C';
                    ctx.font = 'bold 30px sans-serif';
                    const nameLines = canvasWrappedLines(ctx, item.name, 660).slice(0, 2);
                    nameLines.forEach((line, i) => ctx.fillText(line, 335, top + 52 + i * 39));

                    ctx.font = '22px sans-serif';
                    ctx.fillStyle = '#666';

                if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) {
                    return '帳號或密碼錯誤';

        const Quiz = ({ setView, setQuizResults, liquors }) => {
            const [step, setStep] = React.useState(0);
            const [answers, setAnswers] = React.useState({
                target: "",
                budget: "",
                sizeCategory: [],
                purpose: "",
                experience: "",
                style: [],
                flavor: [],
                taste: []
            });

            const currentQ = quizQuestions[step];
            
            const handleSelect = (val) => {
                if (currentQ.type === 'single') {
                    setAnswers({ ...answers, [currentQ.field]: val });
                } else {
                    const currentArr = answers[currentQ.field];
                    if (currentArr.includes(val)) {
                        setAnswers({ ...answers, [currentQ.field]: currentArr.filter(item => item !== val) });
                    } else {
                        if (currentArr.length < currentQ.max) {
                            setAnswers({ ...answers, [currentQ.field]: [...currentArr, val] });
                        }
                    }
                }
            };

            const calculateResults = () => {
                // 1. 只推薦目前標示為有庫存/可推薦的酒款。
                const availableLiquors = liquors.map(normalizeLiquor).filter(l => getStockStatus(l) !== '暫無');

                // 2. 預算優先作為硬篩選；若完全沒有符合，就只取價格最接近的候選酒款。
                let matchedLiquors = availableLiquors.filter(l => checkBudgetMatch(Number(l.price) || 0, answers.budget));
                let budgetFallback = false;

                if (matchedLiquors.length === 0 && availableLiquors.length > 0) {
                    budgetFallback = true;
                    matchedLiquors = [...availableLiquors]
                        .sort((a, b) => getBudgetDistance(Number(a.price) || 0, answers.budget) - getBudgetDistance(Number(b.price) || 0, answers.budget))
                        .slice(0, Math.min(8, availableLiquors.length));
                }

                // 3. 容量是偏好條件：有符合時才縮小候選，避免因容量造成完全沒有結果。
                if (answers.sizeCategory.length > 0 && matchedLiquors.length > 0) {
                    const sizeMatched = matchedLiquors.filter(l => answers.sizeCategory.includes(l.tags?.sizeCategory));
                    if (sizeMatched.length > 0) matchedLiquors = sizeMatched;
                }

                // 4. 依「這次需求符合程度」排序，不替酒本身做主觀量化評分。
                const scoredLiquors = matchedLiquors.map(liquor => {
                    const tags = liquor.tags || {};
                    const targetTags = getSafeTagArray(tags, 'target');
                    const purposeTags = getSafeTagArray(tags, 'purpose');
                    const experienceTags = getSafeTagArray(tags, 'experience');
                    const styleTags = getSafeTagArray(tags, 'style');
                    const flavorTags = getSafeTagArray(tags, 'flavor');
                    const tasteTags = getSafeTagArray(tags, 'taste');

                    const matchedStyles = getMatchedSelections(styleTags, answers.style);
                    const matchedFlavors = getMatchedSelections(flavorTags, answers.flavor);
                    const matchedTastes = getMatchedSelections(tasteTags, answers.taste, TASTE_ALIASES);

                    let score = 0;
                    const matchReasons = [];

                    if (targetTags.includes(answers.target)) {
                        score += MATCH_WEIGHTS.target;
                        matchReasons.push(`適合${answers.target}`);
                    }
                    if (purposeTags.includes(answers.purpose)) {
                        score += MATCH_WEIGHTS.purpose;
                        matchReasons.push(`適合${answers.purpose}`);
                    }
                    if (answers.experience !== "不知道" && experienceTags.includes(answers.experience)) {
                        score += MATCH_WEIGHTS.experience;
                        matchReasons.push(`符合「${answers.experience}」的飲酒經驗`);
                    }
                    if (answers.sizeCategory.includes(tags.sizeCategory)) {
                        score += MATCH_WEIGHTS.sizeCategory;
                        matchReasons.push(`符合偏好容量`);
                    }
                    if (matchedStyles.length > 0) {
                        score += matchedStyles.length * MATCH_WEIGHTS.style;
                        matchReasons.push(`具備${matchedStyles.join('、')}特色`);
                    }
                    if (matchedFlavors.length > 0) {
                        score += matchedFlavors.length * MATCH_WEIGHTS.flavor;
                        matchReasons.push(`香氣偏向${matchedFlavors.join('、')}`);
                    }
                    if (matchedTastes.length > 0) {
                        score += matchedTastes.length * MATCH_WEIGHTS.taste;
                        matchReasons.push(`口感符合${matchedTastes.join('、')}`);
                    }

                    const baseReason = liquor.text?.reason || liquor.text?.shortIntro || '';
                    const personalizedReason = matchReasons.length > 0
                        ? `這款酒${matchReasons.join('，')}。${baseReason}`
                        : baseReason;

                    return {
                        ...liquor,
                        score,
                        matchCount: matchReasons.length,
                        matchReasons,
                        personalizedReason
                    };
                });

                scoredLiquors.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
                    return 0;
                });

                const top3 = scoredLiquors.slice(0, 3);
                setQuizResults({ top3, ranked: scoredLiquors, budgetFallback, answers });
                setView('results');
            };

            const nextStep = () => {
                if (step < quizQuestions.length - 1) {
                    setStep(step + 1);
                } else {
                    calculateResults();
                }
            };

            const prevStep = () => {
                if (step > 0) {
                    setStep(step - 1);
                } else {
                    setView('home');
                }
            };

            const isCurrentAnswerValid = () => {
                if (currentQ.optional) return true;
                const val = answers[currentQ.field];
                if (currentQ.type === 'single') return val !== "";
                if (currentQ.type === 'multiple') return val.length > 0;
                return false;
            };

            return (
                <div className="max-w-md mx-auto px-4 py-8 min-h-[80vh] flex flex-col">
                    <div className="mb-8">
                        <div className="flex justify-between mb-2 text-sm text-gray-500">
                            <span>問題 {step + 1} / {quizQuestions.length}</span>
                            <span>{Math.round(((step + 1) / quizQuestions.length) * 100)}%</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div className="bg-km-gold h-2 rounded-full transition-all duration-300" style={{ width: `${((step + 1) / quizQuestions.length) * 100}%` }}></div>
                        </div>
                    </div>

                    <div className="flex-grow">
                        <h2 className="text-2xl font-serif font-bold text-km-blue mb-2">{currentQ.title}</h2>
                        {currentQ.subtitle && <p className="text-sm text-km-red mb-6">{currentQ.subtitle}</p>}

                        <div className="space-y-3 mt-6">
                            {currentQ.options.map(opt => {
                                const isSelected = currentQ.type === 'single' 
                                    ? answers[currentQ.field] === opt 
                                    : answers[currentQ.field].includes(opt);
                                
                                return (
                                    <label key={opt} className={`custom-${currentQ.type === 'single' ? 'radio' : 'checkbox'} block w-full cursor-pointer`}>
                                        <input 
                                            type="checkbox" 
                                            className="hidden" 
                                            checked={isSelected}
                                            onChange={() => handleSelect(opt)}
                                        />
                                        <div className={`p-4 rounded-lg border-2 text-lg text-center font-medium transition-all duration-200
                                            ${isSelected ? 'bg-km-blue border-km-blue text-white shadow-md' : 'bg-white border-km-gray text-gray-700 hover:border-km-gold'}`}>
                                            {opt}
                                        </div>
                                    </label>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex space-x-4 mt-8 pt-6 border-t border-gray-200">
                        <Button variant="outline" onClick={prevStep} className="w-1/3">上一步</Button>
                        <Button variant="primary" onClick={nextStep} disabled={!isCurrentAnswerValid()} className="w-2/3">
                            {step === quizQuestions.length - 1 ? '看推薦結果' : (currentQ.optional && (!answers[currentQ.field] || answers[currentQ.field].length === 0) ? '跳過' : '下一步')}
                        </Button>
                    </div>
                </div>
            );
        };

        const Results = ({ setView, results, setSelectedLiquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite }) => {
            if (!results || !results.top3 || results.top3.length === 0) {
                return <div className="text-center py-20">目前沒有符合條件的可推薦酒款，請重新測驗。</div>;
            }

            const ranked = results.ranked?.length ? results.ranked : results.top3;
            const [offset, setOffset] = React.useState(0);
            const [shareStatus, setShareStatus] = React.useState('');
            const displayed = ranked.slice(offset, offset + 3);
            const visibleItems = displayed.length ? displayed : ranked.slice(0, 3);

            const getRankBadge = (index) => {
                switch(index) {
                    case 0: return { label: offset === 0 ? "🥇 最推薦" : "另一個選擇", color: "bg-km-red text-white" };
                    case 1: return { label: offset === 0 ? "🥈 第二推薦" : "風格替代", color: "bg-km-gold text-white" };
                    case 2: return { label: offset === 0 ? "✨ 特色推薦" : "也可以看看", color: "bg-km-blue text-white" };
                    default: return { label: "推薦", color: "bg-gray-500 text-white" };
                }
            };

            const viewDetail = (liquor) => {
                setSelectedLiquor(liquor);
                setView('detail');
            };

            const handleNextGroup = () => {
                if (ranked.length <= 3) return;
                const next = offset + 3;
                setOffset(next >= ranked.length ? 0 : next);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleShareResults = async () => {
                setShareStatus('產生分享圖片中…');
                const blob = await makeShareBlob({ results: { ...results, top3: visibleItems } });
                await shareOrDownloadBlob(blob, '怡亨選酒推薦.png', { title: '我的怡亨選酒結果', text: '這是我用怡亨選酒小幫手找到的酒款' });
                setShareStatus('分享圖片已開始下載');
                setTimeout(() => setShareStatus(''), 2200);
            };

            return (
                <div className="max-w-2xl mx-auto px-4 py-8 pb-24">
                    <div className="text-center mb-8">
                        <h2 className="text-2xl font-serif font-bold text-km-blue mb-3">為您找到最符合需求的酒款</h2>
                        {results.budgetFallback && <div className="bg-orange-50 border border-orange-200 text-orange-700 px-4 py-3 rounded-lg text-sm mb-4">💡 你的預算區間目前沒有可推薦酒款，因此以下改以價格最接近的酒款作為參考，再依其他需求排序。</div>}
                        <p className="text-gray-600">根據「<span className="font-bold text-km-blue">{results.answers.target}</span>」、「<span className="font-bold text-km-blue">{results.answers.purpose}</span>」與其他偏好，系統依符合條件的程度排序。</p>
                        <p className="text-xs text-gray-400 mt-2">這裡的排序代表符合本次需求的程度，不是替酒款本身評分。</p>
                    </div>

                    <div className="space-y-6">
                        {visibleItems.map((liquor, index) => {
                            const badge = getRankBadge(index);
                            return (
                                <div key={liquor.id} className="km-card overflow-hidden relative cursor-pointer group hover:border-km-gold transition-colors" onClick={() => viewDetail(liquor)}>
                                    <div className={`absolute top-0 left-0 px-4 py-1.5 rounded-br-xl font-bold text-sm shadow-sm z-10 ${badge.color}`}>{badge.label}</div>
                                    <div className="flex flex-col sm:flex-row">
                                        <div className="w-full sm:w-2/5 bg-gray-100 flex justify-center items-center overflow-hidden relative">
                                            <img src={liquor.image} alt={liquor.name} className="w-full h-48 sm:h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"/>
                                            <button type="button" onClick={(e) => { e.stopPropagation(); onToggleFavorite(liquor.id); }} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/90 shadow flex items-center justify-center text-xl text-km-red">{favoriteIds.includes(liquor.id) ? '♥' : '♡'}</button>
                                        </div>
                                        <div className="w-full sm:w-3/5 p-5 flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-start mb-2 mt-4 sm:mt-0"><h3 className="text-xl font-serif font-bold text-km-blue">{liquor.name}</h3></div>
                                                <div className="flex items-center justify-between mb-2"><span className="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600">{inferLiquorType(liquor)} · {getStockStatus(liquor)}</span><span className="text-xs text-gray-500 font-medium">{liquor.volume}ml / {liquor.abv}%</span></div>
                                                <div className="mb-3 flex flex-wrap gap-2">
                                                    <InquiryButton liquor={liquor} isInList={inquiryIds.includes(liquor.id)} onToggle={onToggleInquiry} size="small" />
                                                    <CompareButton liquor={liquor} isCompared={compareIds.includes(liquor.id)} onToggle={onToggleCompare} size="small" />
                                                </div>
                                                <div className="flex flex-wrap mb-3">
                                                    {liquor.tags?.flavor?.map(t => <Tag key={`flv-${t}`} text={t} type="flavor" onClick={(e) => { e.stopPropagation(); onFlavorClick(t); }} />)}
                                                    {liquor.tags?.taste?.map(t => <Tag key={`tst-${t}`} text={t} type="taste" />)}
                                                </div>
                                                <p className="text-sm text-gray-600 mb-4 line-clamp-2">{liquor.text?.shortIntro}</p>
                                            </div>
                                            <div className="bg-km-white p-3 rounded-lg border border-km-gold-light border-opacity-50">
                                                <p className="text-xs text-km-blue font-bold mb-2">為什麼會出現在這裡？</p>
                                                <div className="flex flex-wrap gap-1.5 mb-2">{(liquor.matchReasons || []).map(reason => <span key={reason} className="text-[11px] px-2 py-1 bg-blue-50 text-km-blue rounded-full border border-blue-100">{reason}</span>)}</div>
                                                <p className="text-xs text-gray-700 leading-relaxed">{liquor.personalizedReason}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {ranked.length > 3 && <Button variant="secondary" onClick={handleNextGroup}>換一組推薦</Button>}
                        <Button variant="gold" onClick={handleShareResults}>分享推薦結果圖片</Button>
                    </div>
                    {shareStatus && <p className="text-center text-xs text-km-blue mt-3 font-bold">{shareStatus}</p>}

                    <div className="mt-8 flex flex-col space-y-3 max-w-sm mx-auto">
                        <Button variant="primary" onClick={() => setView('catalog')}>瀏覽所有酒款</Button>
                        <Button variant="outline" onClick={() => setView('quiz')}>重新測驗</Button>
                    </div>
                </div>
            );
        };

        const Catalog = ({ setView, liquors, setSelectedLiquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite, recentIds }) => {
            const [selectedFilters, setSelectedFilters] = React.useState([]);
            const [selectedFlavors, setSelectedFlavors] = React.useState([]);
            const [searchQuery, setSearchQuery] = React.useState('');

            const categoryOptions = [
                { id: 'all', label: '全部' },
                { id: 'favorites', label: '♡ 我的收藏' },
                { id: 'gift', label: '送禮推薦' },
                { id: 'self', label: '自飲推薦' },
                { id: 'beginner', label: '新手友善' },
                { id: 'classic', label: '經典酒款' },
                { id: 'aged', label: '陳高／熟陳' },
                { id: 'barrel', label: '桶陳酒款' },
                { id: 'collectible', label: '收藏／紀念' },
                { id: 'special', label: '特色酒款' }
            ];

            const getArray = (value) => Array.isArray(value) ? value : [];

            const flavorOptions = React.useMemo(() => {
                const counts = {};
                liquors.map(normalizeLiquor).forEach(liquor => {
                    getArray(liquor.tags?.flavor).forEach(flavor => {
                        if (!flavor) return;
                        counts[flavor] = (counts[flavor] || 0) + 1;
                    });
                });

                const extras = Object.keys(counts).filter(flavor => !PRESET_FLAVORS.includes(flavor));
                return [...PRESET_FLAVORS, ...extras]
                    .filter(flavor => counts[flavor] > 0)
                    .map(flavor => ({ id: flavor, label: flavor, count: counts[flavor] }));
            }, [liquors]);
            const getSearchText = (rawLiquor) => {
                const liquor = normalizeLiquor(rawLiquor);
                const tags = liquor.tags || {};
                const text = liquor.text || {};
                return [liquor.name, liquor.series, liquor.age, liquor.type, getStockStatus(liquor), liquor.abv, `${liquor.abv}%`, liquor.volume, `${liquor.volume}ml`, ...getArray(tags.target), ...getArray(tags.purpose), ...getArray(tags.experience), ...getArray(tags.style), ...getArray(tags.attributes), ...getArray(tags.flavor), ...getArray(tags.taste), tags.sizeCategory, text.shortIntro, text.fullIntro, text.tastingNotes, text.story, text.reason].filter(Boolean).join(' ').toLowerCase();
            };

            const matchesSingleCategory = (rawLiquor, filterId) => {
                const liquor = normalizeLiquor(rawLiquor);
                const tags = liquor.tags || {};
                const purpose = getArray(tags.purpose);
                const experience = getArray(tags.experience);
                const style = getArray(tags.style);
                const searchText = getSearchText(liquor);

                switch (filterId) {
                    case 'favorites': return favoriteIds.includes(liquor.id);
                    case 'gift': return purpose.includes('送禮');
                    case 'self': return purpose.includes('自飲');
                    case 'beginner': return experience.includes('第一次喝');
                    case 'classic': return style.includes('經典');
                    case 'aged': return liquor.type === '陳年高粱' || /(陳高|陳年|熟陳|老酒|窖藏|特窖)/.test(searchText);
                    case 'barrel': return liquor.type === '桶陳' || /(桶陳|雪莉桶|波本桶|橡木桶|威士忌桶|雙桶)/.test(searchText);
                    case 'collectible': return !!tags.collectible || purpose.includes('收藏') || purpose.includes('紀念') || liquor.type === '紀念酒' || (tags.attributes || []).some(tag => ['紀念酒', '限量'].includes(tag));
                    case 'special': return !!tags.special || liquor.type === '限量／特色' || ['特別', '有故事'].some(tag => style.includes(tag)) || (tags.attributes || []).some(tag => ['限量', '專供／限定', '金門限定', '聯名', '特殊造型'].includes(tag));
                    default: return true;
                }
            };

            const toggleFilter = (filterId) => {
                if (filterId === 'all') {
                    setSelectedFilters([]);
                    return;
                }
                setSelectedFilters(current =>
                    current.includes(filterId)
                        ? current.filter(id => id !== filterId)
                        : [...current, filterId]
                );
            };

            const toggleFlavor = (flavor) => {
                setSelectedFlavors(current =>
                    current.includes(flavor)
                        ? current.filter(item => item !== flavor)
                        : [...current, flavor]
                );
            };

            const filteredLiquors = React.useMemo(() => {
                const keywords = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
                return liquors.map(normalizeLiquor).filter((liquor) => {
                    // 分類多選採「同時符合」。
                    if (selectedFilters.length && !selectedFilters.every(filterId => matchesSingleCategory(liquor, filterId))) {
                        return false;
                    }

                    // 風味多選也採「同時符合」；例如勾「鮮果＋花蜜」會找兩種都有的酒。
                    const liquorFlavors = getArray(liquor.tags?.flavor);
                    if (selectedFlavors.length && !selectedFlavors.every(flavor => liquorFlavors.includes(flavor))) {
                        return false;
                    }

                    if (!keywords.length) return true;
                    const haystack = getSearchText(liquor);
                    return keywords.every(keyword => haystack.includes(keyword));
                });
            }, [liquors, selectedFilters, selectedFlavors, searchQuery, favoriteIds]);

            const recentLiquors = recentIds.map(id => liquors.find(l => l.id === id)).filter(Boolean).slice(0, 5);
            const viewDetail = (liquor) => { setSelectedLiquor(liquor); setView('detail'); };
            const hasActiveSearch = searchQuery.trim().length > 0 || selectedFilters.length > 0 || selectedFlavors.length > 0;

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 pb-28">
                    <div className="flex justify-between items-center mb-5">
                        <div><h2 className="text-2xl font-serif font-bold text-km-blue">所有酒款</h2><p className="text-xs text-gray-500 mt-1">搜尋酒名、類型、年份、酒精度、容量、風味、口感與用途</p></div>
                        <span className="text-sm text-gray-500 whitespace-nowrap">共 {filteredLiquors.length} 款</span>
                    </div>

                    <div className="relative mb-4">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">⌕</div>
                        <input type="search" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜尋酒名、陳高、桶陳、花蜜、58度、送禮……" className="w-full bg-white border-2 border-gray-200 rounded-xl pl-10 pr-10 py-3 text-sm outline-none focus:border-km-gold transition-colors shadow-sm" />
                        {searchQuery && <button type="button" onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-km-blue text-xl">&times;</button>}
                    </div>
                    <div className="mb-3">
                        <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-bold text-km-blue">分類可複選</span>
                            {selectedFilters.length > 0 && (
                                <button
                                    type="button"
                                    onClick={() => setSelectedFilters([])}
                                    className="text-xs text-km-red underline underline-offset-2"
                                >
                                    清除分類
                                </button>
                            )}
                        </div>
                        <div className="flex space-x-2 overflow-x-auto pb-3">
                            {categoryOptions.map(option => {
                                const isAll = option.id === 'all';
                                const isSelected = isAll ? selectedFilters.length === 0 : selectedFilters.includes(option.id);
                                return (
                                    <button
                                        key={option.id}
                                        type="button"
                                        onClick={() => toggleFilter(option.id)}
                                        className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-colors inline-flex items-center gap-1.5 ${
                                            isSelected
                                                ? 'bg-km-blue text-white shadow-sm'
                                                : 'bg-white text-gray-600 border border-gray-300 hover:border-km-gold'
                                        }`}
                                    >
                                        {!isAll && <span className="text-xs">{isSelected ? '✓' : '□'}</span>}
                                        {option.label}
                                    </button>
                                );
                            })}
                        </div>
                        <p className="text-[11px] text-gray-400 mt-1">
                            可同時勾選多個分類；結果會顯示「同時符合所有已勾分類」的酒款。
                        </p>
                    </div>

                    <div className="mb-5 rounded-xl bg-white border border-gray-200 p-4 shadow-sm">
                        <div className="flex items-center justify-between gap-3 mb-3">
                            <div>
                                <div className="text-sm font-bold text-km-blue">👃 依風味篩選</div>
                                <div className="text-[11px] text-gray-400 mt-0.5">客人問「有沒有果香、木質、醬陳？」時可以直接勾選</div>
                            </div>
                            {selectedFlavors.length > 0 && (
                                <button
                                    type="button"
                                    onClick={() => setSelectedFlavors([])}
                                    className="text-xs text-km-red underline underline-offset-2 whitespace-nowrap"
                                >
                                    清除風味
                                </button>
                            )}
                        </div>

                        <div className="flex flex-wrap gap-2">
                            {flavorOptions.map(option => {
                                const isSelected = selectedFlavors.includes(option.id);
                                return (
                                    <button
                                        key={option.id}
                                        type="button"
                                        onClick={() => toggleFlavor(option.id)}
                                        className={`px-3 py-1.5 rounded-full text-xs transition-colors inline-flex items-center gap-1.5 ${
                                            isSelected
                                                ? 'bg-km-red text-white border border-km-red shadow-sm'
                                                : 'bg-km-red/5 text-km-red border border-km-red/20 hover:bg-km-red/10'
                                        }`}
                                    >
                                        <span>{isSelected ? '✓' : '□'}</span>
                                        <span>{option.label}</span>
                                        <span className={`${isSelected ? 'text-white/75' : 'text-gray-400'} text-[10px]`}>{option.count}</span>
                                    </button>
                                );
                            })}
                        </div>

                        <p className="text-[11px] text-gray-400 mt-3">
                            可複選；多選時只顯示同時具有所有已勾風味的酒款。數字代表目前資料庫中具有該風味的酒款數。
                        </p>
                    </div>

                    {recentLiquors.length > 0 && !hasActiveSearch && (
                        <div className="mb-5 p-4 rounded-xl bg-white border border-km-gray">
                            <div className="text-xs font-bold text-km-blue mb-2">最近看過</div>
                            <div className="flex gap-2 overflow-x-auto pb-1">{recentLiquors.map(item => <button key={item.id} type="button" onClick={() => viewDetail(item)} className="px-3 py-2 rounded-lg bg-gray-50 border text-xs text-gray-700 whitespace-nowrap hover:border-km-gold">{item.name}</button>)}</div>
                        </div>
                    )}

                    {hasActiveSearch && (
                        <div className="flex items-center justify-between mb-5 text-xs text-gray-500 gap-3">
                            <span className="min-w-0">
                                {selectedFilters.length > 0 && (
                                    <>
                                        分類：
                                        <span className="font-bold text-km-blue">
                                            {selectedFilters
                                                .map(id => categoryOptions.find(item => item.id === id)?.label)
                                                .filter(Boolean)
                                                .join(' ＋ ')}
                                        </span>
                                    </>
                                )}
                                {selectedFilters.length > 0 && selectedFlavors.length > 0 && <span className="mx-1">·</span>}
                                {selectedFlavors.length > 0 && (
                                    <>
                                        風味：
                                        <span className="font-bold text-km-red">
                                            {selectedFlavors.join(' ＋ ')}
                                        </span>
                                    </>
                                )}
                                {(selectedFilters.length > 0 || selectedFlavors.length > 0) && searchQuery.trim() && <span className="mx-1">·</span>}
                                {searchQuery.trim() && (
                                    <>
                                        搜尋：
                                        <span className="font-bold text-km-blue">「{searchQuery.trim()}」</span>
                                    </>
                                )}
                            </span>
                            <button
                                type="button"
                                onClick={() => { setSelectedFilters([]); setSelectedFlavors([]); setSearchQuery(''); }}
                                className="text-km-red underline underline-offset-2 whitespace-nowrap"
                            >
                                清除條件
                            </button>
                        </div>
                    )}

                    {filteredLiquors.length === 0 ? (

        const Detail = ({ setView, liquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite }) => {

                        {normalized.text.story && <div className="mb-8 bg-gray-50 p-5 rounded-lg"><h3 className="text-lg font-bold text-km-blue mb-2">酒款故事</h3><p className="text-gray-600 text-sm leading-relaxed italic serif-text">「{normalized.text.story}」</p></div>}

        const TagEditor = ({ label, tags = [], onAddTag, onRemoveTag, presets = [], badgeColor = 'red' }) => {
            const [inputValue, setInputValue] = React.useState('');

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (inputValue.trim()) {
                        onAddTag(inputValue.trim());
                        setInputValue('');
                    }
                }
            };

            const handleAddClick = (e) => {
                e.preventDefault();
                if (inputValue.trim()) {
                    onAddTag(inputValue.trim());
                    setInputValue('');
                }
            };

            return (
                <div className="mb-4">
                    <label className="block text-sm font-bold text-gray-700 mb-1">{label}</label>
                    
                    {/* 目前已選標籤 */}
                    <div className="flex flex-wrap gap-1.5 mb-2 min-h-[34px] p-2 bg-gray-50 border border-gray-200 rounded-lg">
                        {tags.length === 0 && (
                            <span className="text-xs text-gray-400 py-1">尚未加入任何標籤</span>
                        )}
                        {tags.map((tag) => (
                            <span 
                                key={tag} 
                                className={`inline-flex items-center text-xs px-2.5 py-1 rounded-md font-medium ${
                                    badgeColor === 'red' 
                                        ? 'bg-km-red/10 text-km-red border border-km-red/30'
                                        : badgeColor === 'gold'
                                        ? 'bg-amber-50 text-amber-800 border border-amber-200'
                                        : 'bg-blue-100 text-blue-800 border border-blue-200'
                                }`}

                                {tag}
                                <button 
                                    type="button" 
                                    onClick={() => onRemoveTag(tag)}
                                    className="ml-1.5 text-gray-500 hover:text-red-700 font-bold leading-none"
                                >
                                    &times;
                                </button>
                            </span>
                        ))}
                    </div>

                    {/* 輸入自訂標籤 */}
                    <div className="flex space-x-2 mb-2">
                        <input 
                            type="text" 
                            value={inputValue} 
                            onChange={(e) => setInputValue(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder={`輸入自訂${label}後按 Enter 或點新增`}
                            className="flex-grow border rounded-lg p-2 text-sm focus:border-km-blue outline-none"
                        />
                        <button 
                            type="button"
                            onClick={handleAddClick}
                            className="bg-km-blue text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-opacity-90"
                        >

                    </div>

                    {/* 常用標籤快速點選 */}
                    {presets && presets.length > 0 && (
                        <div className="flex flex-wrap items-center gap-1.5 mt-1">
                            <span className="text-[11px] text-gray-400 mr-1">常用推薦:</span>
                            {presets.map((preset) => {
                                const isAdded = tags.includes(preset);
                                return (
                                    <button
                                        key={preset}
                                        type="button"
                                        onClick={() => isAdded ? onRemoveTag(preset) : onAddTag(preset)}
                                        className={`text-xs px-2 py-0.5 rounded transition-colors ${
                                            isAdded 
                                                ? 'bg-gray-300 text-gray-700 line-through opacity-60' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        {isAdded ? `已加 ${preset}` : `+ ${preset}`}

                    )}
