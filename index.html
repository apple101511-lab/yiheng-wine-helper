    <!-- Firebase 雲端資料同步服務 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            setDoc,
            onSnapshot
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Web App 設定
        const firebaseConfig = {
            apiKey: "AIzaSyBePx19LLbe0moEpt3bdFuewNvPpCunH-8",
            authDomain: "yiheng-wine-helper.firebaseapp.com",
            projectId: "yiheng-wine-helper",
            storageBucket: "yiheng-wine-helper.firebasestorage.app",
            messagingSenderId: "646676406460",
            appId: "1:646676406460:web:fa2f5c0bf7d34e1613b0b9",
            measurementId: "G-S01YR3RMYL"
        };

        const APP_ID = "yiheng-wine-helper";
        const ADMIN_UID = "7cHgc6NZmRXbzypHfhKsIJKYvCo1";
        const STORAGE_KEY = "yiheng_liquors_catalog_v1";

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        let currentUser = auth.currentUser;

        // 提供 React 使用的 Firebase 操作介面
        window.__cloudStorage = {
            isReady: true,
            isLocal: false,

            signInAdmin: async (email, password) => {
                try {
                    const credential = await signInWithEmailAndPassword(auth, email, password);

                    if (credential.user.uid !== ADMIN_UID) {
                        await signOut(auth);
                        return {
                            success: false,
                            error: "此帳號沒有管理員權限"
                        };
                    }

                    currentUser = credential.user;
                    return {
                        success: true,
                        user: credential.user
                    };
                } catch (error) {
                    console.error("Firebase 登入失敗：", error);
                    return {
                        success: false,
                        code: error.code || "",
                        error: error.message || "登入失敗"
                    };
                }
            },

            signOutAdmin: async () => {
                await signOut(auth);
                currentUser = null;
            },

            isAdmin: () => {
                return !!currentUser && currentUser.uid === ADMIN_UID;
            },

            saveLiquors: async (liquorsList) => {
                if (!currentUser || currentUser.uid !== ADMIN_UID) {
                    console.error("沒有管理員寫入權限");
                    return false;
                }

                try {
                    const catalogDoc = doc(
                        db,
                        "artifacts",
                        APP_ID,
                        "public",
                        "data",
                        "inventory",
                        "catalog"
                    );

                    await setDoc(catalogDoc, {
                        items: liquorsList,
                        updatedAt: new Date().toISOString()
                    });

                    // localStorage 僅作為本機快取，不作為主要資料來源
                    try {
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(liquorsList));
                    } catch (e) {}

                    return true;
                } catch (error) {
                    console.error("雲端儲存失敗：", error);
                    return false;
                }
            },

            subscribeLiquors: (onUpdate, onError) => {
                const catalogDoc = doc(
                    db,
                    "artifacts",
                    APP_ID,
                    "public",
                    "data",
                    "inventory",
                    "catalog"
                );

                return onSnapshot(
                    catalogDoc,
                    (snapshot) => {
                        if (snapshot.exists()) {
                            const data = snapshot.data();
                            if (data && Array.isArray(data.items)) {
                                try {
                                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data.items));
                                } catch (e) {}
                                onUpdate(data.items);
                            }
                        } else {
                            // 第一次建立資料庫時尚未有 catalog 文件。
                            // 網站仍會顯示內建/快取酒款，管理員可在後台按「同步目前資料」首次上傳。
                            onUpdate(null);
                        }
                    },
                    (error) => {
                        console.error("Firestore 讀取失敗：", error);
                        if (onError) onError(error);
                    }
                );
            }
        };

        // 監聽 Firebase Authentication 狀態，讓 React 能在重新整理後維持管理員登入狀態
        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            window.dispatchEvent(new CustomEvent("firebase-auth-changed", {
                detail: {
                    isAdmin: !!user && user.uid === ADMIN_UID
                }
            }));
        });

        window.dispatchEvent(new CustomEvent("cloud-ready"));
    </script>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const flavorDictionary = {
            "穀糧": { title: "穀糧香", desc: "最典型的「高粱本體味」，像熟米飯、穀物的甜香。" },
            "麴香": { title: "麴香", desc: "比穀糧香更有發酵感，是金門高粱辨識度很高的一類。" },
            "蜜餞": { title: "梅子蜜餞", desc: "帶有青梅、烏梅、話梅等果乾氣息，常帶酸、甜、鹹交錯感。" },
            "鮮果": { title: "梨瓜果香", desc: "帶有水梨、甜瓜、青蘋果等新鮮水果香，讓酒顯得清甜、年輕、活潑。" },
            "花蜜": { title: "花蜜甜香", desc: "帶有白花、蜂蜜的氣息，屬於柔和、芳香的雅致甜感。" },
            "醬陳": { title: "醬陳香", desc: "常見於有年份或熟陳酒，帶有老酒香與窖香，風格沉穩厚實。" },
            "草本": { title: "草本藥材", desc: "老酒容易散發此氣味（如甘草、人蔘），常伴隨微苦、回甘。" },
            "木質": { title: "木質烘焙", desc: "陳年或特窖產品特別明顯，帶有檀香或杉木、焦糖等延伸香氣。" }
        };

        const PRESET_FLAVORS = ["穀糧", "麴香", "蜜餞", "鮮果", "花蜜", "醬陳", "草本", "木質"];
        const PRESET_TASTES = ["甘冽", "滑順", "綿甜", "醇厚", "爽淨", "回甘有勁", "微酸生津", "圓潤柔和", "強勁有力"];
        const PRESET_TARGETS = ["長輩", "家人", "主管/客戶", "朋友", "伴侶", "自己"];
        const PRESET_PURPOSES = ["送禮", "自飲", "收藏", "宴客", "紀念", "嘗鮮"];
        const PRESET_EXPERIENCES = ["第一次喝", "偶爾喝", "常喝", "老饕"];
        const PRESET_STYLES = ["經典", "體面", "穩重", "霸氣", "文雅", "特別", "喜氣", "有故事", "造型", "金門限定", "輕巧"];

        const PRESET_TYPES = ["一般高粱", "陳年高粱", "桶陳", "紀念酒", "限量／特色", "禮盒", "罈裝"];
        const PRESET_STOCK_STATUSES = ["現貨", "少量", "可詢問", "暫無"];

        const inferLiquorType = (liquor = {}) => {
            if (liquor.type) return liquor.type;
            const tags = liquor.tags || {};
            const text = liquor.text || {};
            const haystack = [
                liquor.name, liquor.age,
                ...(Array.isArray(tags.style) ? tags.style : []),
                ...(Array.isArray(tags.purpose) ? tags.purpose : []),
                text.shortIntro, text.fullIntro, text.story
            ].filter(Boolean).join(' ');
            if (/(桶陳|雪莉桶|波本桶|橡木桶|威士忌桶|雙桶)/.test(haystack)) return "桶陳";
            if (/(陳高|陳年|熟陳|老酒|特窖|窖藏)/.test(haystack)) return "陳年高粱";
            if (/紀念/.test(haystack)) return "紀念酒";
            if (/(罈|壇裝|甕裝)/.test(haystack)) return "罈裝";
            if (/禮盒/.test(haystack)) return "禮盒";
            if (tags.special) return "限量／特色";
            return "一般高粱";
        };

        const getStockStatus = (liquor = {}) => {
            if (PRESET_STOCK_STATUSES.includes(liquor.stockStatus)) return liquor.stockStatus;
            return liquor.stock === false ? "暫無" : "現貨";
        };

        const normalizeLiquor = (liquor = {}) => ({
            ...liquor,
            type: inferLiquorType(liquor),
            stockStatus: getStockStatus(liquor),
            stock: getStockStatus(liquor) !== "暫無",
            tags: {
                ...(liquor.tags || {}),
                target: Array.isArray(liquor.tags?.target) ? liquor.tags.target : [],
                purpose: Array.isArray(liquor.tags?.purpose) ? liquor.tags.purpose : [],
                experience: Array.isArray(liquor.tags?.experience) ? liquor.tags.experience : [],
                style: Array.isArray(liquor.tags?.style) ? liquor.tags.style : [],
                flavor: Array.isArray(liquor.tags?.flavor) ? liquor.tags.flavor : [],
                taste: Array.isArray(liquor.tags?.taste) ? liquor.tags.taste : []
            },
            text: { ...(liquor.text || {}) }
        });

        const getBaseSiteUrl = () => `${window.location.origin}${window.location.pathname}`;
        const getWineShareUrl = (id) => `${getBaseSiteUrl()}?wine=${encodeURIComponent(id)}`;
        const getInquiryShareUrl = (ids) => `${getBaseSiteUrl()}?list=${ids.map(encodeURIComponent).join(',')}`;

        const copyPlainText = async (text) => {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    return true;
                }
            } catch (e) {}
            try {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                const ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                return ok;
            } catch (e) {
                return false;
            }
        };

        const canvasWrappedLines = (ctx, text, maxWidth) => {
            const chars = String(text || '').split('');
            const lines = [];
            let line = '';
            chars.forEach(char => {
                const test = line + char;
                if (ctx.measureText(test).width > maxWidth && line) {
                    lines.push(line);
                    line = char;
                } else {
                    line = test;
                }
            });
            if (line) lines.push(line);
            return lines;
        };

        const makeShareBlob = async ({ liquor = null, results = null }) => {
            const canvas = document.createElement('canvas');
            canvas.width = 1080;
            canvas.height = 1350;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#F9F6F0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#1A2F4C';
            ctx.fillRect(0, 0, canvas.width, 170);
            ctx.fillStyle = '#E8D5A5';
            ctx.font = 'bold 42px sans-serif';
            ctx.fillText('怡亨選酒小幫手', 72, 92);
            ctx.fillStyle = '#FFFFFF';
            ctx.font = '24px sans-serif';
            ctx.fillText(liquor ? '酒款分享卡' : '我的選酒結果', 72, 132);

            if (liquor) {
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 54px sans-serif';
                const titleLines = canvasWrappedLines(ctx, liquor.name, 920).slice(0, 3);
                titleLines.forEach((line, i) => ctx.fillText(line, 72, 260 + i * 70));
                let y = 260 + titleLines.length * 70 + 26;
                ctx.font = '30px sans-serif';
                ctx.fillStyle = '#A63C30';
                ctx.fillText(`${liquor.abv}% Vol  ·  ${liquor.volume}ml  ·  ${inferLiquorType(liquor)}`, 72, y);
                y += 75;
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('風味', 72, y);
                ctx.font = '28px sans-serif';
                ctx.fillStyle = '#555';
                ctx.fillText((liquor.tags?.flavor || []).join('・') || '依酒款資料為準', 180, y);
                y += 55;
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('口感', 72, y);
                ctx.font = '28px sans-serif';
                ctx.fillStyle = '#555';
                ctx.fillText((liquor.tags?.taste || []).join('・') || '依酒款資料為準', 180, y);
                y += 80;
                ctx.fillStyle = '#FFFFFF';
                ctx.strokeStyle = '#E2DFD8';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.roundRect(60, y, 960, 360, 24);
                ctx.fill();
                ctx.stroke();
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 28px sans-serif';
                ctx.fillText('酒款介紹', 92, y + 58);
                ctx.font = '27px sans-serif';
                ctx.fillStyle = '#555';
                const introLines = canvasWrappedLines(ctx, liquor.text?.shortIntro || liquor.text?.reason || '', 850).slice(0, 6);
                introLines.forEach((line, i) => ctx.fillText(line, 92, y + 112 + i * 43));
                const url = getWineShareUrl(liquor.id);
                ctx.fillStyle = '#1A2F4C';
                ctx.font = '22px sans-serif';
                ctx.fillText('掃描／點擊分享連結查看完整酒款資訊', 72, 1220);
                ctx.fillStyle = '#777';
                ctx.font = '18px sans-serif';
                const shortUrl = url.length > 80 ? url.slice(0, 77) + '…' : url;
                ctx.fillText(shortUrl, 72, 1260);
            } else if (results) {
                ctx.fillStyle = '#1A2F4C';
                ctx.font = 'bold 42px sans-serif';
                ctx.fillText('為你挑出的酒款', 72, 250);
                const items = (results.top3 || []).slice(0, 3);
                items.forEach((item, idx) => {
                    const top = 320 + idx * 270;
                    ctx.fillStyle = '#FFFFFF';
                    ctx.strokeStyle = '#E2DFD8';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.roundRect(60, top, 960, 220, 22);
                    ctx.fill();
                    ctx.stroke();
                    ctx.fillStyle = '#C5A059';
                    ctx.font = 'bold 38px sans-serif';
                    ctx.fillText(String(idx + 1).padStart(2, '0'), 92, top + 62);
                    ctx.fillStyle = '#1A2F4C';
                    ctx.font = 'bold 32px sans-serif';
                    const nameLines = canvasWrappedLines(ctx, item.name, 760).slice(0, 2);
                    nameLines.forEach((line, i) => ctx.fillText(line, 170, top + 58 + i * 42));
                    ctx.font = '23px sans-serif';
                    ctx.fillStyle = '#666';
                    ctx.fillText(`${item.abv}% Vol · ${item.volume}ml · ${inferLiquorType(item)}`, 170, top + 150);
                    const reason = (item.matchReasons || []).slice(0, 3).join('、');
                    ctx.fillText(reason ? `符合：${reason}` : '依你的需求綜合推薦', 170, top + 188);
                });
                ctx.fillStyle = '#1A2F4C';
                ctx.font = '22px sans-serif';
                ctx.fillText('完整資訊請至怡亨選酒小幫手查看', 72, 1200);
                ctx.fillStyle = '#777';
                ctx.font = '18px sans-serif';
                ctx.fillText(getBaseSiteUrl(), 72, 1240);
            }

            ctx.fillStyle = '#A63C30';
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText('禁止酒駕｜未滿十八歲禁止飲酒', 72, 1310);

            return await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 0.95));
        };

        const shareOrDownloadBlob = async (blob, filename, shareData = {}) => {
            if (!blob) return false;
            const file = new File([blob], filename, { type: 'image/png' });
            try {
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ ...shareData, files: [file] });
                    return true;
                }
            } catch (e) {
                if (e?.name === 'AbortError') return false;
            }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            return true;
        };

        // 推薦分數只代表「符合這次需求的程度」，不是替酒本身評分。
        const MATCH_WEIGHTS = {
            target: 5,
            purpose: 5,
            experience: 4,
            taste: 3,
            flavor: 2,
            style: 2,
            sizeCategory: 1
        };

        // 部分舊資料使用相近但不完全相同的口感文字，這裡只做同義詞/近義詞匹配。
        const TASTE_ALIASES = {
            "甘冽": ["甘冽", "清冽"],
            "滑順": ["滑順", "柔順", "順口"],
            "綿甜": ["綿甜", "甘甜", "微甘"],
            "醇厚": ["醇厚", "厚實", "飽滿"],
            "爽淨": ["爽淨", "清爽", "俐落"],
            "回甘有勁": ["回甘", "有勁"],
            "微酸生津": ["微酸", "生津"],
            "圓潤柔和": ["圓潤", "柔和"],
            "強勁有力": ["強勁", "勁冽", "強烈"]
        };

        const getSafeTagArray = (tags, key) => Array.isArray(tags?.[key]) ? tags[key] : [];

        const getMatchedSelections = (wineTags = [], selections = [], aliasMap = null) => {
            if (!Array.isArray(wineTags) || !Array.isArray(selections) || selections.length === 0) return [];
            return selections.filter(selection => {
                const keywords = aliasMap?.[selection] || [selection];
                return wineTags.some(tag => {
                    const tagText = String(tag || '');
                    return keywords.some(keyword => tagText.includes(keyword) || keyword.includes(tagText));
                });
            });
        };

        const initialLiquors = [
            {
                id: "L001", name: "58度白金龍(白標)", price: 440, abv: 58, volume: 600, age: "無",
                image: "https://placehold.co/300x400/F9F6F0/1A2F4C?text=58%E5%BA%A6\n%E7%99%BD%E9%87%91%E9%BE%8D", stock: true,
                tags: { target: ["長輩", "家人", "自己"], purpose: ["送禮", "自飲", "宴客"], experience: ["偶爾喝", "常喝", "老饕"], style: ["經典", "穩重"], flavor: ["穀糧", "麴香"], taste: ["甘冽", "滑順", "回甘有勁"], collectible: false, special: false, sizeCategory: "中瓶 (500~750ml)" },
                text: { shortIntro: "最具代表性的金門高粱，香氣濃郁，口感甘冽。", fullIntro: "俗稱「白金龍」的58度金門高粱酒，是金門酒廠最經典的代表作。採用優質高粱與小麥，純糧固態發酵。", tastingNotes: "初聞有清新的糧香，入口後強烈的酒精感帶來甘冽的刺激，滑順回甘、有勁。", story: "自1962年問世以來，超過半個世紀的配方傳承，見證了無數喜慶與團聚時刻。", reason: "經典不敗的選擇，口感甘冽滑順、回甘有勁，展現穩重的風格。" }
            },
            {
                id: "L002", name: "58度白金龍(白標) 300ml", price: 235, abv: 58, volume: 300, age: "無",

        const checkBudgetMatch = (price, budgetStr) => {
            switch(budgetStr) {
                case "500 元以下": return price <= 500;
                case "500～1000 元": return price > 500 && price <= 1000;
                case "1000～3000 元": return price > 1000 && price <= 3000;
                case "3000～5000 元": return price > 3000 && price <= 5000;
                case "5000～10000 元": return price > 5000 && price <= 10000;
                case "10000 元以上": return price > 10000;
                default: return true;
            }
        };

        const getBudgetBounds = (budgetStr) => {
            switch(budgetStr) {
                case "500 元以下": return [0, 500];
                case "500～1000 元": return [500, 1000];
                case "1000～3000 元": return [1000, 3000];
                case "3000～5000 元": return [3000, 5000];
                case "5000～10000 元": return [5000, 10000];
                case "10000 元以上": return [10000, Infinity];
                default: return [0, Infinity];
            }
        };

        const getBudgetDistance = (price, budgetStr) => {
            const [min, max] = getBudgetBounds(budgetStr);
            if (price < min) return min - price;
            if (price > max) return price - max;
            return 0;
        };

        const LoginModal = ({ onClose, onSuccess }) => {
            const [email, setEmail] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [loading, setLoading] = React.useState(false);

            const getFriendlyError = (result) => {
                const code = result?.code || '';
                if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) {
                    return '帳號或密碼錯誤';
                }
                if (code.includes('invalid-email')) return 'Email 格式不正確';
                if (code.includes('too-many-requests')) return '登入嘗試次數過多，請稍後再試';
                if (result?.error === '此帳號沒有管理員權限') return result.error;
                return '登入失敗，請確認帳號、密碼與網路連線';
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');

                if (!email.trim() || !password) {
                    setError('請輸入管理員 Email 與密碼');
                    return;
                }

                if (!window.__cloudStorage || !window.__cloudStorage.isReady) {
                    setError('Firebase 尚未連線完成，請稍後再試');
                    return;
                }

                setLoading(true);
                const result = await window.__cloudStorage.signInAdmin(email.trim(), password);
                setLoading(false);

                if (result.success) {
                    setPassword('');
                    onSuccess(result.user);
                } else {
                    setError(getFriendlyError(result));
                    setPassword('');
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[150] px-4" onClick={onClose}>
                    <div className="bg-white rounded-xl shadow-2xl max-w-sm w-full overflow-hidden p-6" onClick={e => e.stopPropagation()}>

                        <form onSubmit={handleSubmit}>
                            <input
                                type="email"
                                value={email}
                                onChange={(e) => { setEmail(e.target.value); setError(''); }}
                                placeholder="管理員 Email"
                                autoComplete="username"
                                className="w-full border-2 border-gray-200 rounded-lg p-3 mb-3 focus:border-km-blue outline-none transition-colors"
                                autoFocus
                            />
                            <input
                                type="password"
                                value={password}
                                onChange={(e) => { setPassword(e.target.value); setError(''); }}
                                placeholder="管理員密碼"
                                autoComplete="current-password"
                                className="w-full border-2 border-gray-200 rounded-lg p-3 mb-2 focus:border-km-blue outline-none transition-colors"
                            />
                            {error && <p className="text-km-red text-sm mb-4 text-center">{error}</p>}
                            <div className="mt-6 flex space-x-3">
                                <Button variant="outline" onClick={onClose} type="button" disabled={loading}>取消</Button>
                                <Button variant="primary" type="submit" disabled={loading}>
                                    {loading ? '登入中...' : '登入'}
                                </Button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        };

        const Header = ({ setView, onAdminClick, cloudStatus }) => (
            <header className="sticky top-0 z-50 bg-km-white border-b border-km-gray shadow-sm">
                <div className="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                    <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setView('home')}>
                        <img 
                            src="https://cdn.phototourl.com/free/2026-09-16-3e94f8d2-adfa-4360-bb16-4a2d8e67ef7c.png" 
                            alt="怡亨 Logo" 
                            className="h-10 w-auto"
                            onError={(e) => {
                                e.target.onerror = null; 
                                e.target.src = "https://placehold.co/40x40/1A2F4C/C5A059?text=%E6%80%A1";
                            }}
                        />
                        <div>
                            <h1 className="text-xl font-serif font-bold text-km-blue tracking-wide">怡亨選酒小幫手</h1>
                            {cloudStatus && (
                                <div className="flex items-center space-x-1.5 text-[11px] font-medium text-gray-500">
                                    <span className={`w-2 h-2 rounded-full ${
                                        cloudStatus === 'synced' ? 'bg-emerald-500' :
                                        cloudStatus === 'saving' ? 'bg-amber-500 animate-ping' :
                                        cloudStatus === 'connecting' ? 'bg-blue-400 animate-pulse' : cloudStatus === 'empty' ? 'bg-sky-400' : 'bg-red-400'

                                    </span>

                        className="text-sm text-gray-500 hover:text-km-blue underline underline-offset-4"
                    >

        );

        const Home = ({ setView }) => (
            <div className="flex flex-col items-center justify-center min-h-[80vh] px-6 text-center max-w-lg mx-auto py-10">
                <div className="mb-8 transform hover:scale-105 transition-transform duration-300">
                     <img 
                        src="https://cdn.phototourl.com/free/2026-09-16-3e94f8d2-adfa-4360-bb16-4a2d8e67ef7c.png" 
                        alt="怡亨選酒小幫手 Logo" 
                        className="h-32 w-auto drop-shadow-md"
                        onError={(e) => {

                        }}
                    />
                </div>
                <h2 className="text-3xl font-serif font-bold text-km-blue mb-4 leading-tight">

                </h2>
                <p className="text-gray-600 mb-10 text-lg">
                    告訴我們送誰、預算與需求，短短一分鐘，快速找到最適合你的金門高粱。
                </p>
                <div className="w-full space-y-4">
                    <Button variant="primary" onClick={() => setView('quiz')} className="text-lg py-4">

                    </Button>
                    <Button variant="secondary" onClick={() => setView('catalog')}>
                        直接瀏覽所有酒款
                    </Button>

        );

        const Quiz = ({ setView, setQuizResults, liquors }) => {
            const [step, setStep] = React.useState(0);
            const [answers, setAnswers] = React.useState({
                target: "",
                budget: "",
                sizeCategory: [],
                purpose: "",
                experience: "",
                style: [],
                flavor: [],
                taste: []
            });

            const currentQ = quizQuestions[step];
            
            const handleSelect = (val) => {
                if (currentQ.type === 'single') {
                    setAnswers({ ...answers, [currentQ.field]: val });
                } else {
                    const currentArr = answers[currentQ.field];
                    if (currentArr.includes(val)) {
                        setAnswers({ ...answers, [currentQ.field]: currentArr.filter(item => item !== val) });
                    } else {
                        if (currentArr.length < currentQ.max) {
                            setAnswers({ ...answers, [currentQ.field]: [...currentArr, val] });
                        }
                    }
                }
            };

            const calculateResults = () => {
                // 1. 只推薦目前標示為有庫存/可推薦的酒款。
                const availableLiquors = liquors.map(normalizeLiquor).filter(l => getStockStatus(l) !== '暫無');

                // 2. 預算優先作為硬篩選；若完全沒有符合，就只取價格最接近的候選酒款。
                let matchedLiquors = availableLiquors.filter(l => checkBudgetMatch(Number(l.price) || 0, answers.budget));
                let budgetFallback = false;

                if (matchedLiquors.length === 0 && availableLiquors.length > 0) {
                    budgetFallback = true;
                    matchedLiquors = [...availableLiquors]
                        .sort((a, b) => getBudgetDistance(Number(a.price) || 0, answers.budget) - getBudgetDistance(Number(b.price) || 0, answers.budget))
                        .slice(0, Math.min(8, availableLiquors.length));
                }

                // 3. 容量是偏好條件：有符合時才縮小候選，避免因容量造成完全沒有結果。
                if (answers.sizeCategory.length > 0 && matchedLiquors.length > 0) {
                    const sizeMatched = matchedLiquors.filter(l => answers.sizeCategory.includes(l.tags?.sizeCategory));
                    if (sizeMatched.length > 0) matchedLiquors = sizeMatched;
                }

                // 4. 依「這次需求符合程度」排序，不替酒本身做主觀量化評分。
                const scoredLiquors = matchedLiquors.map(liquor => {
                    const tags = liquor.tags || {};
                    const targetTags = getSafeTagArray(tags, 'target');
                    const purposeTags = getSafeTagArray(tags, 'purpose');
                    const experienceTags = getSafeTagArray(tags, 'experience');
                    const styleTags = getSafeTagArray(tags, 'style');
                    const flavorTags = getSafeTagArray(tags, 'flavor');
                    const tasteTags = getSafeTagArray(tags, 'taste');

                    const matchedStyles = getMatchedSelections(styleTags, answers.style);
                    const matchedFlavors = getMatchedSelections(flavorTags, answers.flavor);
                    const matchedTastes = getMatchedSelections(tasteTags, answers.taste, TASTE_ALIASES);

                    let score = 0;
                    const matchReasons = [];

                    if (targetTags.includes(answers.target)) {
                        score += MATCH_WEIGHTS.target;
                        matchReasons.push(`適合${answers.target}`);
                    }
                    if (purposeTags.includes(answers.purpose)) {
                        score += MATCH_WEIGHTS.purpose;
                        matchReasons.push(`適合${answers.purpose}`);
                    }
                    if (answers.experience !== "不知道" && experienceTags.includes(answers.experience)) {
                        score += MATCH_WEIGHTS.experience;
                        matchReasons.push(`符合「${answers.experience}」的飲酒經驗`);
                    }
                    if (answers.sizeCategory.includes(tags.sizeCategory)) {
                        score += MATCH_WEIGHTS.sizeCategory;
                        matchReasons.push(`符合偏好容量`);
                    }
                    if (matchedStyles.length > 0) {
                        score += matchedStyles.length * MATCH_WEIGHTS.style;
                        matchReasons.push(`具備${matchedStyles.join('、')}特色`);
                    }
                    if (matchedFlavors.length > 0) {
                        score += matchedFlavors.length * MATCH_WEIGHTS.flavor;
                        matchReasons.push(`香氣偏向${matchedFlavors.join('、')}`);
                    }
                    if (matchedTastes.length > 0) {
                        score += matchedTastes.length * MATCH_WEIGHTS.taste;
                        matchReasons.push(`口感符合${matchedTastes.join('、')}`);
                    }

                    const baseReason = liquor.text?.reason || liquor.text?.shortIntro || '';
                    const personalizedReason = matchReasons.length > 0
                        ? `這款酒${matchReasons.join('，')}。${baseReason}`
                        : baseReason;

                    return {
                        ...liquor,
                        score,
                        matchCount: matchReasons.length,
                        matchReasons,
                        personalizedReason
                    };
                });

                scoredLiquors.sort((a, b) => {
                    if (b.score !== a.score) return b.score - a.score;
                    if (b.matchCount !== a.matchCount) return b.matchCount - a.matchCount;
                    return 0;
                });

                const top3 = scoredLiquors.slice(0, 3);
                setQuizResults({ top3, ranked: scoredLiquors, budgetFallback, answers });
                setView('results');
            };

            const nextStep = () => {
                if (step < quizQuestions.length - 1) {
                    setStep(step + 1);
                } else {
                    calculateResults();
                }
            };

            const prevStep = () => {
                if (step > 0) {
                    setStep(step - 1);
                } else {
                    setView('home');
                }
            };

            const isCurrentAnswerValid = () => {
                if (currentQ.optional) return true;
                const val = answers[currentQ.field];
                if (currentQ.type === 'single') return val !== "";
                if (currentQ.type === 'multiple') return val.length > 0;
                return false;
            };

            return (
                <div className="max-w-md mx-auto px-4 py-8 min-h-[80vh] flex flex-col">
                    <div className="mb-8">
                        <div className="flex justify-between mb-2 text-sm text-gray-500">
                            <span>問題 {step + 1} / {quizQuestions.length}</span>
                            <span>{Math.round(((step + 1) / quizQuestions.length) * 100)}%</span>
                        </div>
                        <div className="w-full bg-gray-200 rounded-full h-2">
                            <div className="bg-km-gold h-2 rounded-full transition-all duration-300" style={{ width: `${((step + 1) / quizQuestions.length) * 100}%` }}></div>
                        </div>
                    </div>

                    <div className="flex-grow">
                        <h2 className="text-2xl font-serif font-bold text-km-blue mb-2">{currentQ.title}</h2>
                        {currentQ.subtitle && <p className="text-sm text-km-red mb-6">{currentQ.subtitle}</p>}

                        <div className="space-y-3 mt-6">
                            {currentQ.options.map(opt => {
                                const isSelected = currentQ.type === 'single' 
                                    ? answers[currentQ.field] === opt 
                                    : answers[currentQ.field].includes(opt);
                                
                                return (
                                    <label key={opt} className={`custom-${currentQ.type === 'single' ? 'radio' : 'checkbox'} block w-full cursor-pointer`}>
                                        <input 
                                            type="checkbox" 
                                            className="hidden" 
                                            checked={isSelected}
                                            onChange={() => handleSelect(opt)}
                                        />
                                        <div className={`p-4 rounded-lg border-2 text-lg text-center font-medium transition-all duration-200
                                            ${isSelected ? 'bg-km-blue border-km-blue text-white shadow-md' : 'bg-white border-km-gray text-gray-700 hover:border-km-gold'}`}>
                                            {opt}
                                        </div>
                                    </label>
                                );
                            })}
                        </div>
                    </div>

                    <div className="flex space-x-4 mt-8 pt-6 border-t border-gray-200">
                        <Button variant="outline" onClick={prevStep} className="w-1/3">上一步</Button>
                        <Button variant="primary" onClick={nextStep} disabled={!isCurrentAnswerValid()} className="w-2/3">
                            {step === quizQuestions.length - 1 ? '看推薦結果' : (currentQ.optional && (!answers[currentQ.field] || answers[currentQ.field].length === 0) ? '跳過' : '下一步')}
                        </Button>
                    </div>
                </div>
            );
        };

        const Results = ({ setView, results, setSelectedLiquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite }) => {
            if (!results || !results.top3 || results.top3.length === 0) {
                return <div className="text-center py-20">目前沒有符合條件的可推薦酒款，請重新測驗。</div>;
            }

            const ranked = results.ranked?.length ? results.ranked : results.top3;
            const [offset, setOffset] = React.useState(0);
            const [shareStatus, setShareStatus] = React.useState('');
            const displayed = ranked.slice(offset, offset + 3);
            const visibleItems = displayed.length ? displayed : ranked.slice(0, 3);

            const getRankBadge = (index) => {
                switch(index) {
                    case 0: return { label: offset === 0 ? "🥇 最推薦" : "另一個選擇", color: "bg-km-red text-white" };
                    case 1: return { label: offset === 0 ? "🥈 第二推薦" : "風格替代", color: "bg-km-gold text-white" };
                    case 2: return { label: offset === 0 ? "✨ 特色推薦" : "也可以看看", color: "bg-km-blue text-white" };
                    default: return { label: "推薦", color: "bg-gray-500 text-white" };
                }
            };

            const viewDetail = (liquor) => {
                setSelectedLiquor(liquor);
                setView('detail');
            };

            const handleNextGroup = () => {
                if (ranked.length <= 3) return;
                const next = offset + 3;
                setOffset(next >= ranked.length ? 0 : next);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleShareResults = async () => {
                setShareStatus('產生分享圖片中…');
                const blob = await makeShareBlob({ results: { ...results, top3: visibleItems } });
                await shareOrDownloadBlob(blob, '怡亨選酒推薦.png', { title: '我的怡亨選酒結果', text: '這是我用怡亨選酒小幫手找到的酒款' });
                setShareStatus('分享圖片已準備完成');
                setTimeout(() => setShareStatus(''), 2200);
            };

            return (
                <div className="max-w-2xl mx-auto px-4 py-8 pb-24">
                    <div className="text-center mb-8">
                        <h2 className="text-2xl font-serif font-bold text-km-blue mb-3">為您找到最符合需求的酒款</h2>
                        {results.budgetFallback && <div className="bg-orange-50 border border-orange-200 text-orange-700 px-4 py-3 rounded-lg text-sm mb-4">💡 你的預算區間目前沒有可推薦酒款，因此以下改以價格最接近的酒款作為參考，再依其他需求排序。</div>}
                        <p className="text-gray-600">根據「<span className="font-bold text-km-blue">{results.answers.target}</span>」、「<span className="font-bold text-km-blue">{results.answers.purpose}</span>」與其他偏好，系統依符合條件的程度排序。</p>
                        <p className="text-xs text-gray-400 mt-2">這裡的排序代表符合本次需求的程度，不是替酒款本身評分。</p>
                    </div>

                    <div className="space-y-6">
                        {visibleItems.map((liquor, index) => {
                            const badge = getRankBadge(index);
                            return (
                                <div key={liquor.id} className="km-card overflow-hidden relative cursor-pointer group hover:border-km-gold transition-colors" onClick={() => viewDetail(liquor)}>
                                    <div className={`absolute top-0 left-0 px-4 py-1.5 rounded-br-xl font-bold text-sm shadow-sm z-10 ${badge.color}`}>{badge.label}</div>
                                    <div className="flex flex-col sm:flex-row">
                                        <div className="w-full sm:w-2/5 bg-gray-100 flex justify-center items-center overflow-hidden relative">
                                            <img src={liquor.image} alt={liquor.name} className="w-full h-48 sm:h-full object-cover object-center group-hover:scale-105 transition-transform duration-500"/>
                                            <button type="button" onClick={(e) => { e.stopPropagation(); onToggleFavorite(liquor.id); }} className="absolute top-3 right-3 w-9 h-9 rounded-full bg-white/90 shadow flex items-center justify-center text-xl text-km-red">{favoriteIds.includes(liquor.id) ? '♥' : '♡'}</button>
                                        </div>
                                        <div className="w-full sm:w-3/5 p-5 flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-start mb-2 mt-4 sm:mt-0"><h3 className="text-xl font-serif font-bold text-km-blue">{liquor.name}</h3></div>
                                                <div className="flex items-center justify-between mb-2"><span className="text-xs px-2 py-1 rounded-full bg-gray-100 text-gray-600">{inferLiquorType(liquor)} · {getStockStatus(liquor)}</span><span className="text-xs text-gray-500 font-medium">{liquor.volume}ml / {liquor.abv}%</span></div>
                                                <div className="mb-3 flex flex-wrap gap-2">
                                                    <InquiryButton liquor={liquor} isInList={inquiryIds.includes(liquor.id)} onToggle={onToggleInquiry} size="small" />
                                                    <CompareButton liquor={liquor} isCompared={compareIds.includes(liquor.id)} onToggle={onToggleCompare} size="small" />
                                                </div>
                                                <div className="flex flex-wrap mb-3">
                                                    {liquor.tags?.flavor?.map(t => <Tag key={`flv-${t}`} text={t} type="flavor" onClick={(e) => { e.stopPropagation(); onFlavorClick(t); }} />)}
                                                    {liquor.tags?.taste?.map(t => <Tag key={`tst-${t}`} text={t} type="taste" />)}
                                                </div>
                                                <p className="text-sm text-gray-600 mb-4 line-clamp-2">{liquor.text?.shortIntro}</p>
                                            </div>
                                            <div className="bg-km-white p-3 rounded-lg border border-km-gold-light border-opacity-50">
                                                <p className="text-xs text-km-blue font-bold mb-2">為什麼會出現在這裡？</p>
                                                <div className="flex flex-wrap gap-1.5 mb-2">{(liquor.matchReasons || []).map(reason => <span key={reason} className="text-[11px] px-2 py-1 bg-blue-50 text-km-blue rounded-full border border-blue-100">{reason}</span>)}</div>
                                                <p className="text-xs text-gray-700 leading-relaxed">{liquor.personalizedReason}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    <div className="mt-8 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        {ranked.length > 3 && <Button variant="secondary" onClick={handleNextGroup}>換一組推薦</Button>}
                        <Button variant="gold" onClick={handleShareResults}>分享推薦結果圖片</Button>
                    </div>
                    {shareStatus && <p className="text-center text-xs text-km-blue mt-3 font-bold">{shareStatus}</p>}

                    <div className="mt-8 flex flex-col space-y-3 max-w-sm mx-auto">
                        <Button variant="primary" onClick={() => setView('catalog')}>瀏覽所有酒款</Button>
                        <Button variant="outline" onClick={() => setView('quiz')}>重新測驗</Button>
                    </div>
                </div>
            );
        };

        const Catalog = ({ setView, liquors, setSelectedLiquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite, recentIds }) => {
            const [filter, setFilter] = React.useState('all');
            const [searchQuery, setSearchQuery] = React.useState('');

            const categoryOptions = [
                { id: 'all', label: '全部' },
                { id: 'favorites', label: '♡ 我的收藏' },
                { id: 'gift', label: '送禮推薦' },
                { id: 'self', label: '自飲推薦' },
                { id: 'beginner', label: '新手友善' },
                { id: 'classic', label: '經典酒款' },
                { id: 'aged', label: '陳高／熟陳' },
                { id: 'barrel', label: '桶陳酒款' },
                { id: 'collectible', label: '收藏／紀念' },
                { id: 'special', label: '特色酒款' }
            ];

            const getArray = (value) => Array.isArray(value) ? value : [];
            const getSearchText = (rawLiquor) => {
                const liquor = normalizeLiquor(rawLiquor);
                const tags = liquor.tags || {};
                const text = liquor.text || {};
                return [liquor.name, liquor.age, liquor.type, getStockStatus(liquor), liquor.abv, `${liquor.abv}%`, liquor.volume, `${liquor.volume}ml`, ...getArray(tags.target), ...getArray(tags.purpose), ...getArray(tags.experience), ...getArray(tags.style), ...getArray(tags.flavor), ...getArray(tags.taste), tags.sizeCategory, text.shortIntro, text.fullIntro, text.tastingNotes, text.story, text.reason].filter(Boolean).join(' ').toLowerCase();
            };

            const matchesCategory = (rawLiquor) => {
                const liquor = normalizeLiquor(rawLiquor);
                const tags = liquor.tags || {};
                const purpose = getArray(tags.purpose);
                const experience = getArray(tags.experience);
                const style = getArray(tags.style);
                const searchText = getSearchText(liquor);
                switch (filter) {
                    case 'favorites': return favoriteIds.includes(liquor.id);
                    case 'gift': return purpose.includes('送禮');
                    case 'self': return purpose.includes('自飲');
                    case 'beginner': return experience.includes('第一次喝');
                    case 'classic': return style.includes('經典');
                    case 'aged': return liquor.type === '陳年高粱' || /(陳高|陳年|熟陳|老酒|窖藏|特窖)/.test(searchText);
                    case 'barrel': return liquor.type === '桶陳' || /(桶陳|雪莉桶|波本桶|橡木桶|威士忌桶|雙桶)/.test(searchText);
                    case 'collectible': return !!tags.collectible || purpose.includes('收藏') || purpose.includes('紀念') || liquor.type === '紀念酒';
                    case 'special': return !!tags.special || liquor.type === '限量／特色' || ['特別', '金門限定', '造型', '有故事'].some(tag => style.includes(tag));
                    default: return true;
                }
            };

            const filteredLiquors = React.useMemo(() => {
                const keywords = searchQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
                return liquors.map(normalizeLiquor).filter((liquor) => {
                    if (!matchesCategory(liquor)) return false;
                    if (!keywords.length) return true;
                    const haystack = getSearchText(liquor);
                    return keywords.every(keyword => haystack.includes(keyword));
                });
            }, [liquors, filter, searchQuery, favoriteIds]);

            const recentLiquors = recentIds.map(id => liquors.find(l => l.id === id)).filter(Boolean).slice(0, 5);
            const viewDetail = (liquor) => { setSelectedLiquor(liquor); setView('detail'); };
            const hasActiveSearch = searchQuery.trim().length > 0 || filter !== 'all';

            return (
                <div className="max-w-4xl mx-auto px-4 py-8 pb-28">
                    <div className="flex justify-between items-center mb-5">
                        <div><h2 className="text-2xl font-serif font-bold text-km-blue">所有酒款</h2><p className="text-xs text-gray-500 mt-1">搜尋酒名、類型、年份、酒精度、風味、口感與用途</p></div>
                        <span className="text-sm text-gray-500 whitespace-nowrap">共 {filteredLiquors.length} 款</span>
                    </div>

                    <div className="relative mb-4">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">⌕</div>
                        <input type="search" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="搜尋酒名、陳高、桶陳、花蜜、58度、送禮……" className="w-full bg-white border-2 border-gray-200 rounded-xl pl-10 pr-10 py-3 text-sm outline-none focus:border-km-gold transition-colors shadow-sm" />
                        {searchQuery && <button type="button" onClick={() => setSearchQuery('')} className="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-km-blue text-xl">&times;</button>}
                    </div>
                    <div className="flex space-x-2 overflow-x-auto pb-3 mb-3">{categoryOptions.map(option => <button key={option.id} type="button" onClick={() => setFilter(option.id)} className={`px-4 py-2 rounded-full text-sm whitespace-nowrap transition-colors ${filter === option.id ? 'bg-km-blue text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-300 hover:border-km-gold'}`}>{option.label}</button>)}</div>

                    {recentLiquors.length > 0 && !hasActiveSearch && (
                        <div className="mb-5 p-4 rounded-xl bg-white border border-km-gray">
                            <div className="text-xs font-bold text-km-blue mb-2">最近看過</div>
                            <div className="flex gap-2 overflow-x-auto pb-1">{recentLiquors.map(item => <button key={item.id} type="button" onClick={() => viewDetail(item)} className="px-3 py-2 rounded-lg bg-gray-50 border text-xs text-gray-700 whitespace-nowrap hover:border-km-gold">{item.name}</button>)}</div>
                        </div>
                    )}

                    {hasActiveSearch && <div className="flex items-center justify-between mb-5 text-xs text-gray-500"><span>{filter !== 'all' && <>分類：<span className="font-bold text-km-blue">{categoryOptions.find(item => item.id === filter)?.label}</span></>}{filter !== 'all' && searchQuery.trim() && <span className="mx-1">·</span>}{searchQuery.trim() && <>搜尋：<span className="font-bold text-km-blue">「{searchQuery.trim()}」</span></>}</span><button type="button" onClick={() => { setFilter('all'); setSearchQuery(''); }} className="text-km-red underline underline-offset-2">清除條件</button></div>}

                    {filteredLiquors.length === 0 ? (
                        <div className="km-card text-center py-14 px-6"><div className="text-4xl mb-3">🔎</div><h3 className="font-bold text-km-blue mb-2">目前找不到符合條件的酒款</h3><p className="text-sm text-gray-500 mb-5">可以換一個關鍵字，或清除分類後再看看。</p><button type="button" onClick={() => { setFilter('all'); setSearchQuery(''); }} className="px-5 py-2.5 rounded-lg bg-km-blue text-white font-bold text-sm">顯示全部酒款</button></div>
                    ) : (
                        <div className="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {filteredLiquors.map(liquor => (
                                <div key={liquor.id} className="km-card flex flex-col h-full cursor-pointer hover:shadow-lg transition-shadow" onClick={() => viewDetail(liquor)}>
                                    <div className="bg-gray-100 h-44 flex-shrink-0 relative">
                                        <img src={liquor.image} alt={liquor.name} className="w-full h-full object-cover"/>
                                        <div className="absolute bottom-2 right-2 bg-black/60 text-white text-[10px] px-2 py-0.5 rounded backdrop-blur-sm">{liquor.volume}ml</div>
                                        <div className={`absolute top-2 left-2 text-[10px] px-2 py-1 rounded-full ${getStockStatus(liquor) === '暫無' ? 'bg-gray-800/80 text-white' : getStockStatus(liquor) === '少量' ? 'bg-amber-500 text-white' : 'bg-white/90 text-km-blue'}`}>{getStockStatus(liquor)}</div>
                                        <button type="button" onClick={(e) => { e.stopPropagation(); onToggleFavorite(liquor.id); }} className="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 shadow text-lg text-km-red">{favoriteIds.includes(liquor.id) ? '♥' : '♡'}</button>
                                    </div>
                                    <div className="p-4 flex flex-col flex-grow">
                                        <div className="text-[10px] text-gray-400 mb-1">{inferLiquorType(liquor)}</div>
                                        <h3 className="font-bold text-km-blue mb-2 line-clamp-2 min-h-[2.5rem]">{liquor.name}</h3>
                                        <div className="mb-3 flex flex-col items-start gap-2">
                                            <InquiryButton liquor={liquor} isInList={inquiryIds.includes(liquor.id)} onToggle={onToggleInquiry} size="small" />
                                            <CompareButton liquor={liquor} isCompared={compareIds.includes(liquor.id)} onToggle={onToggleCompare} size="small" />
                                        </div>
                                        <p className="text-xs text-gray-500 mb-3 line-clamp-2 flex-grow">{liquor.text?.shortIntro}</p>
                                        <div className="flex flex-wrap mt-auto">{liquor.tags?.flavor?.slice(0, 1).map(t => <Tag key={`c-flv-${t}`} text={t} type="flavor" onClick={(e) => { e.stopPropagation(); onFlavorClick(t); }} />)}{liquor.tags?.taste?.slice(0, 1).map(t => <Tag key={`c-tst-${t}`} text={t} type="taste" />)}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const Detail = ({ setView, liquor, onFlavorClick, inquiryIds, onToggleInquiry, compareIds, onToggleCompare, favoriteIds, onToggleFavorite }) => {
            const [shareStatus, setShareStatus] = React.useState('');
            if (!liquor) return null;
            const normalized = normalizeLiquor(liquor);

            const handleShareLink = async () => {
                const url = getWineShareUrl(normalized.id);
                try {
                    if (navigator.share) {
                        await navigator.share({ title: normalized.name, text: normalized.text?.shortIntro || '怡亨選酒小幫手酒款資訊', url });
                        return;
                    }
                } catch (e) { if (e?.name === 'AbortError') return; }
                const ok = await copyPlainText(url);
                setShareStatus(ok ? '已複製酒款分享連結' : '無法自動複製連結');
                setTimeout(() => setShareStatus(''), 2200);
            };

            const handleShareImage = async () => {
                setShareStatus('產生分享圖片中…');
                const blob = await makeShareBlob({ liquor: normalized });
                await shareOrDownloadBlob(blob, `${normalized.name}-分享卡.png`, { title: normalized.name, text: '怡亨選酒小幫手酒款分享卡', url: getWineShareUrl(normalized.id) });
                setShareStatus('分享圖片已準備完成');
                setTimeout(() => setShareStatus(''), 2200);
            };

            return (
                <div className="max-w-2xl mx-auto bg-white min-h-screen pb-24 relative shadow-sm">
                    <button onClick={() => setView('catalog')} className="fixed top-20 left-4 z-20 w-10 h-10 bg-white/90 backdrop-blur rounded-full flex items-center justify-center shadow-md border border-gray-200 text-km-blue hover:bg-gray-100 transition-colors" title="回總覽"><svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 19l-7-7 7-7" /></svg></button>
                    <div className="w-full h-80 md:h-96 bg-gray-100 relative"><img src={normalized.image} alt={normalized.name} className="w-full h-full object-cover"/><div className={`absolute bottom-4 left-4 px-3 py-1.5 rounded-full text-xs font-bold shadow ${getStockStatus(normalized) === '暫無' ? 'bg-gray-800 text-white' : getStockStatus(normalized) === '少量' ? 'bg-amber-500 text-white' : 'bg-white text-km-blue'}`}>{getStockStatus(normalized)}</div></div>

                    <div className="p-6">
                        <div className="flex flex-wrap mb-3"><Tag text={`${normalized.abv}% Vol`} type="accent" /><Tag text={`${normalized.volume}ml`} type="default" /><Tag text={normalized.type} type="default" />{normalized.age && normalized.age !== "無" && <Tag text={`年份：${normalized.age}`} type="highlight" />}</div>
                        <h2 className="text-3xl font-serif font-bold text-km-blue mb-4">{normalized.name}</h2>

                        <div className="mb-5 flex flex-wrap gap-2">
                            <FavoriteButton liquorId={normalized.id} isFavorite={favoriteIds.includes(normalized.id)} onToggle={onToggleFavorite} size="normal" />
                            <CompareButton liquor={normalized} isCompared={compareIds.includes(normalized.id)} onToggle={onToggleCompare} size="normal" />
                            <button type="button" onClick={handleShareLink} className="px-4 py-2.5 rounded-full border border-km-gold text-km-blue font-bold text-sm bg-white">分享連結</button>
                            <button type="button" onClick={handleShareImage} className="px-4 py-2.5 rounded-full border border-km-gold bg-km-gold text-white font-bold text-sm">產生分享圖片</button>
                        </div>
                        {shareStatus && <div className="mb-4 text-xs font-bold text-km-blue">{shareStatus}</div>}

                        <div className="mb-6 p-4 rounded-xl bg-green-50 border border-green-200 flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><span className="text-xs font-bold text-green-700 uppercase tracking-wider block">專人一對一選酒服務</span><span className="text-sm text-gray-600 font-medium">歡迎透過官方 LINE 詢問即時牌價與現貨存量</span></div><div className="flex flex-col sm:flex-row gap-2 sm:items-center"><InquiryButton liquor={normalized} isInList={inquiryIds.includes(normalized.id)} onToggle={onToggleInquiry} size="normal" /><LineConsultButton size="normal" /></div></div>

                        <div className="mb-6 bg-[#FDFBF7] p-4 rounded-xl border border-km-gray">
                            <div className="mb-3"><span className="text-xs font-bold text-km-red block mb-1.5">👃 風味特色（點擊可查看說明）</span><div className="flex flex-wrap">{normalized.tags.flavor.map(t => <Tag key={`d-flv-${t}`} text={t} type="flavor" onClick={() => onFlavorClick(t)} />)}</div></div>
                            <div><span className="text-xs font-bold text-blue-800 block mb-1.5">👅 口感體驗</span><div className="flex flex-wrap">{normalized.tags.taste.map(t => <Tag key={`d-tst-${t}`} text={t} type="taste" />)}</div></div>
                        </div>

                        <div className="bg-km-white rounded-xl p-5 mb-8 border border-km-gold-light"><h4 className="font-bold text-km-blue mb-2">商品介紹</h4><p className="text-gray-700 leading-relaxed text-sm mb-5">{normalized.text.fullIntro || normalized.text.shortIntro}</p><h4 className="font-bold text-km-blue mb-2 pt-4 border-t border-km-gray">品飲筆記</h4><p className="text-gray-700 leading-relaxed text-sm">{normalized.text.tastingNotes}</p></div>

                        <div className="mb-8"><h3 className="text-lg font-bold text-km-blue mb-4 border-l-4 border-km-gold pl-2">適合對象與場合</h3><div className="flex flex-wrap gap-2">{normalized.tags.target.map(t => <span key={t} className="bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">{t}</span>)}{normalized.tags.purpose.map(t => <span key={t} className="bg-blue-50 text-km-blue px-3 py-1 rounded-full text-sm">{t}</span>)}</div></div>

                        {normalized.text.story && <div className="mb-8 bg-gray-50 p-5 rounded-lg"><h3 className="text-lg font-bold text-km-blue mb-2">酒款故事</h3><p className="text-gray-600 text-sm leading-relaxed italic serif-text">「{normalized.text.story}」</p></div>}
                    </div>
                </div>
            );
        };

        const TagEditor = ({ label, tags = [], onAddTag, onRemoveTag, presets = [], badgeColor = 'red' }) => {
            const [inputValue, setInputValue] = React.useState('');

            const handleKeyDown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (inputValue.trim()) {
                        onAddTag(inputValue.trim());
                        setInputValue('');
                    }
                }
            };

            const handleAddClick = (e) => {
                e.preventDefault();
                if (inputValue.trim()) {
                    onAddTag(inputValue.trim());
                    setInputValue('');
                }
            };

            return (
                <div className="mb-4">
                    <label className="block text-sm font-bold text-gray-700 mb-1">{label}</label>
                    
                    {/* 目前已選標籤 */}
                    <div className="flex flex-wrap gap-1.5 mb-2 min-h-[34px] p-2 bg-gray-50 border border-gray-200 rounded-lg">
                        {tags.length === 0 && (
                            <span className="text-xs text-gray-400 py-1">尚未加入任何標籤</span>
                        )}
                        {tags.map((tag) => (
                            <span 
                                key={tag} 
                                className={`inline-flex items-center text-xs px-2.5 py-1 rounded-md font-medium ${
                                    badgeColor === 'red' 
                                        ? 'bg-km-red/10 text-km-red border border-km-red/30' 
                                        : 'bg-blue-100 text-blue-800 border border-blue-200'
                                }`}
                            >
                                {tag}
                                <button 
                                    type="button" 
                                    onClick={() => onRemoveTag(tag)}
                                    className="ml-1.5 text-gray-500 hover:text-red-700 font-bold leading-none"
                                >
                                    &times;
                                </button>
                            </span>
                        ))}
                    </div>

                    {/* 輸入自訂標籤 */}
                    <div className="flex space-x-2 mb-2">
                        <input 
                            type="text" 
                            value={inputValue} 
                            onChange={(e) => setInputValue(e.target.value)}
                            onKeyDown={handleKeyDown}
                            placeholder={`輸入自訂${label}後按 Enter 或點新增`}
                            className="flex-grow border rounded-lg p-2 text-sm focus:border-km-blue outline-none"
                        />
                        <button 
                            type="button"
                            onClick={handleAddClick}
                            className="bg-km-blue text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-opacity-90"
                        >
                            ＋ 新增
                        </button>
                    </div>

                    {/* 常用標籤快速點選 */}
                    {presets && presets.length > 0 && (
                        <div className="flex flex-wrap items-center gap-1.5 mt-1">
                            <span className="text-[11px] text-gray-400 mr-1">常用推薦:</span>
                            {presets.map((preset) => {
                                const isAdded = tags.includes(preset);
                                return (
                                    <button
                                        key={preset}
                                        type="button"
                                        onClick={() => isAdded ? onRemoveTag(preset) : onAddTag(preset)}
                                        className={`text-xs px-2 py-0.5 rounded transition-colors ${
                                            isAdded 
                                                ? 'bg-gray-300 text-gray-700 line-through opacity-60' 
                                                : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                                        }`}
                                    >
                                        {isAdded ? `已加 ${preset}` : `+ ${preset}`}
                                    </button>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        const Admin = ({ liquors, setLiquors, setView, onSaveToCloud, cloudStatus, onLogout }) => {
            const [editingId, setEditingId] = React.useState(null);
            const [editForm, setEditForm] = React.useState(null);
            const [isAdding, setIsAdding] = React.useState(false);
            
            const [alertMsg, setAlertMsg] = React.useState("");
            const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);

            // 拖曳排序狀態
            const [draggedIndex, setDraggedIndex] = React.useState(null);
            const [dragOverIndex, setDragOverIndex] = React.useState(null);

            const saveAndSync = async (updatedList, message) => {
                setLiquors(updatedList.map(normalizeLiquor));
                setAlertMsg("正在同步至雲端...");

                if (onSaveToCloud) {
                    const success = await onSaveToCloud(updatedList);
                    setAlertMsg(success ? message : "雲端儲存失敗，請確認登入狀態與網路連線。");
                } else {
                    setAlertMsg("雲端儲存功能尚未就緒。");
                }

                setTimeout(() => setAlertMsg(""), 3500);
            };

            const handleManualSync = async () => {
                setAlertMsg("正在把目前酒款同步到 Firestore...");
                const success = onSaveToCloud ? await onSaveToCloud(liquors) : false;
                setAlertMsg(success ? "目前酒款已同步到 Firestore！" : "同步失敗，請確認管理員登入與 Firestore 規則。");
                setTimeout(() => setAlertMsg(""), 3500);
            };

            const handleDragStart = (e, index) => {
                setDraggedIndex(index);
                e.dataTransfer.effectAllowed = "move";
                e.dataTransfer.setData("text/plain", index);
            };

            const handleDragOver = (e, index) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
                if (dragOverIndex !== index) {
                    setDragOverIndex(index);
                }
            };

            const handleDrop = (e, targetIndex) => {
                e.preventDefault();
                if (draggedIndex === null || draggedIndex === targetIndex) {
                    setDraggedIndex(null);
                    setDragOverIndex(null);
                    return;
                }
                const updatedLiquors = [...liquors];
                const [movedItem] = updatedLiquors.splice(draggedIndex, 1);
                updatedLiquors.splice(targetIndex, 0, movedItem);
                
                setDraggedIndex(null);
                setDragOverIndex(null);
                saveAndSync(updatedLiquors, "排序已自動同步儲存至雲端！");
            };

            const handleDragEnd = () => {
                setDraggedIndex(null);
                setDragOverIndex(null);
            };

            const handleMove = (index, direction) => {
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= liquors.length) return;
                const updatedLiquors = [...liquors];
                const [movedItem] = updatedLiquors.splice(index, 1);
                updatedLiquors.splice(targetIndex, 0, movedItem);
                saveAndSync(updatedLiquors, "順序已自動同步儲存至雲端！");
            };

            const handleEdit = (liquor) => {
                setEditingId(liquor.id);
                const cloned = JSON.parse(JSON.stringify(liquor));
                if (!cloned.tags) cloned.tags = {};
                ["target", "purpose", "experience", "style", "flavor", "taste"].forEach(key => {
                    if (!Array.isArray(cloned.tags[key])) cloned.tags[key] = [];
                });
                if (!cloned.text) cloned.text = {};
                cloned.type = inferLiquorType(cloned);
                cloned.stockStatus = getStockStatus(cloned);
                setEditForm(cloned);
                setIsAdding(false);
            };

            const handleAdd = () => {
                const newId = `L${String(liquors.length + 1).padStart(3, '0')}`;
                setEditingId(newId);
                setEditForm({
                    id: newId,
                    name: "",
                    price: 450,
                    abv: 58,
                    volume: 600,
                    age: "無",
                    image: `https://placehold.co/300x400/F9F6F0/1A2F4C?text=New\nItem`,
                    stock: true,
                    stockStatus: "現貨",
                    type: "一般高粱",
                    tags: { 
                        target: ["長輩", "家人", "自己"], 
                        purpose: ["送禮", "自飲"], 
                        experience: ["常喝"], 
                        style: ["經典"], 
                        flavor: ["穀糧"], 
                        taste: ["甘冽", "滑順"],
                        collectible: false, 
                        special: false, 
                        sizeCategory: "中瓶 (500~750ml)" 
                    },
                    text: { 
                        shortIntro: "", 
                        fullIntro: "", 
                        tastingNotes: "", 
                        story: "", 
                        reason: "" 
                    }
                });
                setIsAdding(true);
            };

            const handleSave = () => {
                if (!editForm.name.trim()) {
                    setAlertMsg('請填寫商品名稱');
                    setTimeout(() => setAlertMsg(""), 3000);
                    return;
                }
                if (editForm.price < 0) {
                    setAlertMsg('價格不可為負數');
                    setTimeout(() => setAlertMsg(""), 3000);
                    return;
                }

                let finalSizeCat = "中瓶 (500~750ml)";
                if (editForm.volume < 500) finalSizeCat = "小瓶 (<500ml)";
                else if (editForm.volume > 750) finalSizeCat = "大瓶/罈裝 (>750ml)";
                
                const finalForm = {
                    ...editForm,
                    type: editForm.type || inferLiquorType(editForm),
                    stockStatus: editForm.stockStatus || getStockStatus(editForm),
                    stock: (editForm.stockStatus || getStockStatus(editForm)) !== "暫無",
                    tags: {
                        ...editForm.tags,
                        sizeCategory: finalSizeCat
                    }
                };

                const updatedList = isAdding 
                    ? [...liquors, finalForm] 
                    : liquors.map(l => l.id === finalForm.id ? finalForm : l);

                setEditingId(null);
                setEditForm(null);
                saveAndSync(updatedList, "商品資料已成功儲存至雲端！");
            };

            const handleChange = (field, value, isNested = false, nestedCategory = null) => {
                if (isNested) {
                    setEditForm({
                        ...editForm,
                        [nestedCategory]: {
                            ...editForm[nestedCategory],
                            [field]: value
                        }
                    });
                } else {
                    setEditForm({ ...editForm, [field]: value });
                }
            };

            const handleAddTag = (category, tag) => {
                const currentList = editForm.tags[category] || [];
                if (!currentList.includes(tag)) {
                    setEditForm({
                        ...editForm,
                        tags: {
                            ...editForm.tags,
                            [category]: [...currentList, tag]
                        }
                    });
                }
            };

            const handleRemoveTag = (category, tag) => {
                const currentList = editForm.tags[category] || [];
                setEditForm({
                    ...editForm,
                    tags: {
                        ...editForm.tags,
                        [category]: currentList.filter(t => t !== tag)
                    }
                });
            };

            const handleDuplicate = (liquor) => {
                const base = normalizeLiquor(JSON.parse(JSON.stringify(liquor)));
                const usedIds = new Set(liquors.map(item => item.id));
                let seq = liquors.length + 1;
                let newId = `L${String(seq).padStart(3, '0')}`;
                while (usedIds.has(newId)) { seq += 1; newId = `L${String(seq).padStart(3, '0')}`; }
                const copy = { ...base, id: newId, name: `${base.name}（複製）` };
                setEditingId(newId);
                setEditForm(copy);
                setIsAdding(true);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleQuickStock = (liquor, status) => {
                const updated = liquors.map(item => item.id === liquor.id ? { ...item, stockStatus: status, stock: status !== '暫無' } : item);
                saveAndSync(updated, `「${liquor.name}」庫存狀態已更新！`);
            };

            const handleExportJson = () => {
                const blob = new Blob([JSON.stringify(liquors.map(normalizeLiquor), null, 2)], { type: 'application/json;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `yiheng-wines-${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
            };

            const handleImportJson = (event) => {
                const file = event.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('格式不正確');
                        const normalized = parsed.map(normalizeLiquor);
                        const success = await onSaveToCloud(normalized);
                        if (success) {
                            setLiquors(normalized);
                            setAlertMsg(`已匯入 ${normalized.length} 款酒並同步雲端！`);
                        } else setAlertMsg('匯入後雲端同步失敗，請確認登入狀態。');
                    } catch (e) {
                        setAlertMsg('JSON 匯入失敗，請確認檔案是由本後台匯出的酒款資料。');
                    }
                    event.target.value = '';
                    setTimeout(() => setAlertMsg(''), 4000);
                };
                reader.readAsText(file, 'utf-8');
            };

            const renderForm = () => (
                <div className="bg-white p-6 md:p-8 rounded-xl shadow-lg mb-8 border-2 border-km-blue/20">
                    <div className="flex justify-between items-center border-b pb-4 mb-6">
                        <h3 className="text-xl font-bold font-serif text-km-blue">
                            {isAdding ? '＋ 新增酒款' : `編輯酒款項目: ${editForm.name || editForm.id}`}
                        </h3>
                        <span className="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-mono">
                            ID: {editForm.id}
                        </span>
                    </div>

                    <div className="space-y-6">
                        {/* 1. 基本資訊與價格 */}
                        <div className="bg-gray-50 p-4 rounded-xl border border-gray-200">
                            <h4 className="text-sm font-bold text-km-blue uppercase tracking-wider mb-3">1. 基本規格與價格</h4>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div className="md:col-span-2">
                                    <label className="block text-sm font-medium text-gray-700 mb-1">商品名稱 *</label>
                                    <input 
                                        type="text" 
                                        value={editForm.name} 
                                        onChange={e => handleChange('name', e.target.value)} 
                                        placeholder="如：58度白金龍"
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-km-red mb-1">牌價 / 售價 (NT$) *</label>
                                    <input 
                                        type="number" 
                                        value={editForm.price} 
                                        onChange={e => handleChange('price', parseInt(e.target.value) || 0)} 
                                        className="w-full border-2 border-km-gold/60 rounded-lg p-2.5 focus:border-km-blue outline-none font-bold text-gray-800" 
                                    />
                                    <p className="text-[11px] text-gray-400 mt-1">※ 前台統一顯示「詢問專人」，此價格供測驗預算篩選與內部管理使用</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">酒精濃度 (% Vol)</label>
                                    <input 
                                        type="number" 
                                        step="0.1"
                                        value={editForm.abv} 
                                        onChange={e => handleChange('abv', parseFloat(e.target.value) || 0)} 
                                        className="w-full border rounded-lg p-2.5 focus:border-km-blue outline-none" 
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-1">容量 (ml)</label>
                                    <input 
                                        type="number" 
                                        value={editForm.volume}
